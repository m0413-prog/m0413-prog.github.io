<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>越えロード｜ドット絵RPGヒーロー育成</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>⚔️</text></svg>">
  <!-- フォントは非ブロッキングで読み込む。@importやheadでのrel=stylesheetは、
       その読み込みが終わるまで後続のスクリプト実行をブロックすることがあるため、
       print用として読み込んでからonloadでallに切り替える方式にしている。
       万が一フォントが読み込めなくても、下のフォールバック(monospace)で表示は継続する。 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" media="print" onload="this.media='all'">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'DotGothic16', 'MS Gothic', monospace;
      image-rendering: pixelated;
    }

    body {
      background-color: #050510;
      background-image:
        radial-gradient(#1e1e38 15%, transparent 16%),
        radial-gradient(#1e1e38 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #ffffff;
      margin: 0;
      padding: 16px 8px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* ルビ（ふりがな）のスタイリング */
    ruby {
      ruby-align: center;
    }
    rt {
      font-size: 0.65em;
      color: #ffcc00;
      font-weight: normal;
      line-height: 1.2;
    }

    .rpg-window {
      max-width: 460px;
      width: 100%;
      background: #000044;
      border: 4px solid #ffffff;
      outline: 4px solid #000000;
      box-shadow: inset 0 0 0 4px #0000aa, 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 4px;
      padding: 16px;
      position: relative;
    }

    .title-banner {
      text-align: center;
      background: #e60000;
      border: 2px solid #fff;
      color: #ffff00;
      font-size: 20px;
      padding: 6px;
      margin-bottom: 4px;
      text-shadow: 2px 2px #000;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aaaaff;
      margin-bottom: 12px;
    }

    /* 保護者設定バー */
    .parent-bar {
      background: #000022;
      border: 1px dashed #8888ff;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .parent-btn {
      background: #444477;
      border: 1px solid #aaaaff;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 3px;
    }

    /* キャラクター画面を上部固定（Sticky）に設定 */
    .stage {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: #000022;
      border: 3px solid #5555ff;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.9);
    }

    .level-badge {
      display: inline-block;
      background: #ffcc00;
      color: #000;
      font-size: 14px;
      padding: 2px 8px;
      border: 2px solid #fff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .level-badge rt {
      color: #000000;
      font-weight: bold;
    }

    #characterCanvas {
      background: transparent;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 8px rgba(0,255,255,0.4));
    }

    .powering-up #characterCanvas {
      animation: auraGlow 0.3s infinite alternate;
    }

    .leveling-up #characterCanvas {
      animation: auraGlow 0.25s infinite alternate;
    }

    @keyframes auraGlow {
      0% { filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 12px #ffff00); }
      100% { filter: drop-shadow(0 0 16px #ff00ff) drop-shadow(0 0 24px #ffffff); }
    }

    .levelup-banner {
      display: none;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffcc00;
      color: #000;
      font-size: 13px;
      padding: 4px 10px;
      border: 2px solid #fff;
      white-space: nowrap;
      animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -14px); }
    }

    .status-container {
      display: flex;
      justify-content: space-around;
      background: #000;
      border: 2px solid #fff;
      padding: 6px;
      margin-top: 8px;
    }

    .xp-bar-wrap {
      background: #000;
      border: 2px solid #fff;
      height: 12px;
      margin-top: 8px;
      overflow: hidden;
    }

    .xp-bar-fill {
      background: linear-gradient(90deg, #ffcc00, #ff8800);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease-out;
    }

    .xp-label {
      text-align: center;
      font-size: 11px;
      color: #aaaaff;
      margin-top: 4px;
    }

    .status-item {
      text-align: center;
    }

    .status-title {
      font-size: 11px;
      color: #8888ff;
    }

    .status-num {
      font-size: 20px;
      color: #00ffcc;
      text-shadow: 2px 2px #000;
    }

    .input-group {
      background: #000033;
      border: 2px solid #8888ff;
      padding: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #ffff00;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    label:first-child {
      margin-top: 0;
    }

    input[type="text"], select {
      width: 100%;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      background: #000;
      border: 2px solid #fff;
      padding: 8px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.8;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .radio-item:hover {
      background: #111144;
    }

    .radio-item input[type="radio"] {
      margin-right: 8px;
      accent-color: #ffcc00;
      cursor: pointer;
    }

    .example-box {
      font-size: 12px;
      color: #aaaaff;
      margin-bottom: 6px;
      padding-left: 4px;
      line-height: 1.8;
    }

    .caution-box {
      font-size: 11px;
      color: #ff9999;
      margin-top: -4px;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .flex-row {
      display: flex;
      gap: 8px;
    }

    .rpg-btn {
      width: 100%;
      background: #cc0000;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px;
      font-size: 18px;
      cursor: pointer;
      text-shadow: 2px 2px #000;
      box-shadow: 3px 3px 0px #000;
      margin-top: 8px;
    }

    .rpg-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .rpg-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .sub-btn {
      background: #333366;
      border: 2px solid #8888ff;
      color: #ccccff;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      margin-top: 12px;
    }

    .msg-box {
      background: #000;
      border: 3px solid #fff;
      padding: 12px;
      margin-top: 16px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.8;
      transition: border-color 0.2s ease;
    }

    .msg-title {
      color: #ffcc00;
      font-size: 16px;
      margin-bottom: 6px;
      border-bottom: 1px dashed #fff;
      padding-bottom: 4px;
      transition: color 0.2s ease;
    }

    .skill-name {
      color: #00ffcc;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .history-box {
      background: #000022;
      border: 2px solid #5555ff;
      padding: 10px;
      margin-top: 16px;
    }

    .history-title {
      color: #aaaaff;
      font-size: 13px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      padding: 4px 2px;
      border-bottom: 1px dotted #333366;
      color: #ccccdd;
    }

    .history-pt {
      color: #00ffcc;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .history-empty {
      color: #666699;
      font-size: 12px;
      text-align: center;
      padding: 8px 0;
    }

    .loading-note {
      text-align: center;
      font-size: 12px;
      color: #8888ff;
      margin-bottom: 8px;
    }

    .settings-box {
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="rpg-window">
  <div class="title-banner"><ruby>越<rt>こ</rt></ruby>え⚔️ロード</div>
  <div class="subtitle">〜 <ruby>昨日<rt>きのう</rt></ruby>の<ruby>自分<rt>じぶん</rt></ruby>を<ruby>越<rt>こ</rt></ruby>える、<ruby>長岡<rt>ながおか</rt></ruby>ヒーロー<ruby>育成<rt>いくせい</rt></ruby>RPG 〜</div>

  <!-- 保護者設定バー -->
  <div class="parent-bar">
    <span id="lockStatus">🔓 プレイ<ruby>制限<rt>せいげん</rt></ruby>: <ruby>無制限<rt>むせいげん</rt></ruby></span>
    <button class="parent-btn" onclick="toggleParentControl()">🔒 <ruby>保護者<rt>ほごしゃ</rt></ruby><ruby>設定<rt>せってい</rt></ruby></button>
  </div>

  <div class="loading-note" id="loadingNote">セーブデータを<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>み<ruby>中<rt>ちゅう</rt></ruby>...</div>

  <!-- 固定表示されたステージ画面（Sticky） -->
  <div class="stage" id="stage">
    <div class="levelup-banner" id="levelupBanner">★ レベルアップ！ ★</div>
    <div class="level-badge" id="heroTitle"></div>
    <canvas id="characterCanvas" width="288" height="144" style="max-width:100%; height:auto; border:2px solid #333366;"></canvas>

    <div class="xp-bar-wrap">
      <div class="xp-bar-fill" id="xpBarFill"></div>
    </div>
    <div class="xp-label" id="xpLabel">-</div>

    <div class="status-container">
      <div class="status-item">
        <div class="status-title"><ruby>今日<rt>きょう</rt></ruby>のパワー</div>
        <div class="status-num" id="todayPower">-</div>
      </div>
      <div class="status-item">
        <div class="status-title"><ruby>昨日<rt>きのう</rt></ruby>のパワー</div>
        <div class="status-num" id="yesterdayPower">-</div>
      </div>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div class="input-group">
    <label>▶ ヒーローの<ruby>名<rt>な</rt></ruby>まえ</label>
    <input type="text" id="heroName" value="ミライ" placeholder="※ほんみょうはいれないでね">

    <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだカテゴリー</label>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="宿題・勉強" data-label="宿題・勉強" checked>
        <span>【<ruby>学習<rt>がくしゅう</rt></ruby>】<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>・<ruby>習<rt>なら</rt></ruby>い<ruby>事<rt>ごと</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="お手伝い" data-label="お手伝い">
        <span>【<ruby>貢献<rt>こうけん</rt></ruby>】お<ruby>手伝<rt>てつだ</rt></ruby>い・<ruby>掃除<rt>そうじ</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="運動・健康" data-label="運動・健康">
        <span>【<ruby>体力<rt>たいりょく</rt></ruby>】<ruby>運動<rt>うんどう</rt></ruby>・スポーツ・<ruby>早<rt>はや</rt></ruby><ruby>起<rt>お</rt></ruby>き</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="読書" data-label="読書">
        <span>【<ruby>知識<rt>ちしき</rt></ruby>】<ruby>読書<rt>どくしょ</rt></ruby>（<ruby>本<rt>ほん</rt></ruby>・<ruby>図鑑<rt>ずかん</rt></ruby>）</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="休養・自由時間" data-label="休養・自由時間">
        <span>【<ruby>休養<rt>きゅうよう</rt></ruby>】ゲーム・<ruby>漫画<rt>まんが</rt></ruby>・<ruby>昼寝<rt>ひるね</rt></ruby></span>
      </label>
    </div>

    <div class="flex-row">
      <div style="flex: 1;">
        <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだ<ruby>時間<rt>じかん</rt></ruby></label>
        <select id="actionTime">
          <option value="5" selected>5分間</option>
          <option value="10">10分間</option>
          <option value="15">15分間</option>
          <option value="30">30分間</option>
          <option value="45">45分間</option>
          <option value="60">60分以上</option>
        </select>
      </div>
    </div>

    <label>▶ <ruby>詳<rt>くわ</rt></ruby>しい<ruby>内容<rt>ないよう</rt></ruby>（メモ）</label>
    <div class="example-box">
      <ruby>例<rt>れい</rt></ruby>：<ruby>漢字<rt>かんじ</rt></ruby>ドリル／<ruby>皿洗<rt>さらあら</rt></ruby>い／<ruby>走<rt>はし</rt></ruby>り<ruby>込<rt>こ</rt></ruby>み
    </div>
    <input type="text" id="actionDetail" placeholder="なにをしたか入力してね">
    <div class="caution-box">※<ruby>名前<rt>なまえ</rt></ruby>や<ruby>住所<rt>じゅうしょ</rt></ruby>など<ruby>個人情報<rt>こじんじょうほう</rt></ruby>は<ruby>書<rt>か</rt></ruby>かないでね</div>

    <button class="rpg-btn" id="powerUpBtn" onclick="executePowerUp()" disabled>⚔️ パワーアップ！</button>
  </div>

  <!-- メッセージ表示エリア（入力フォーム直下に配置） -->
  <div class="msg-box" id="msgBox">
    <div class="msg-title" id="msgTitle">★ <ruby>判定<rt>はんてい</rt></ruby><ruby>結果<rt>けっか</rt></ruby></div>
    <div class="skill-name" id="skillName"></div>
    <div id="msgContent"></div>
  </div>

  <!-- 履歴 -->
  <div class="history-box">
    <div class="history-title">
      <span>📜 ぼうけんの<ruby>記録<rt>きろく</rt></ruby></span>
      <span id="historyCount"></span>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">まだ<ruby>記録<rt>きろく</rt></ruby>がありません</div>
    </div>
  </div>

  <!-- データリセットボタン -->
  <div class="settings-box">
    <button class="sub-btn" style="width: 100%;" onclick="resetHero()">🔄 このヒーローのデータをリセット</button>
  </div>

</div>

<script>
  const canvas = document.getElementById('characterCanvas');
  const ctx = canvas.getContext('2d');

  const PARENT_PIN = "361";

  let state = {
    power: 0,
    todayPower: 0,
    yesterdayPower: 0,
    history: [],
    parentLock: false,
    categoryCounts: {},
    lastPlayDate: "",
    lastSkill: "",
    lastMsg: ""
  };

  let currentHeroKey = null;
  let currentLevel = 1;

  // ── ユーティリティ ────────────────────────────────────────
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // 日付をまたいだ場合、todayPowerをyesterdayPowerへ繰り上げる。
  // loadHero() / executePowerUp() の両方から同じ関数を呼ぶことで、
  // 「読み込み時に繰り上げたのに保存されず、次の操作でもう一度繰り上がって
  // 前日の記録が消える」問題を防ぐ。戻り値は「繰り上げが発生したか」。
  function handleDayRollover() {
    const today = getTodayStr();
    if (state.lastPlayDate && state.lastPlayDate !== today) {
      state.yesterdayPower = state.todayPower;
      state.todayPower = 0;
      state.categoryCounts = {};
      state.lastPlayDate = today;
      return true;
    } else if (!state.lastPlayDate) {
      state.lastPlayDate = today;
    }
    return false;
  }

  // 背景描画
  const SCENE_NAMES = [
    "<ruby>村<rt>むら</rt></ruby>はずれ",
    "<ruby>町<rt>まち</rt></ruby>なか",
    "<ruby>森<rt>もり</rt></ruby>の<ruby>入口<rt>いりぐち</rt></ruby>",
    "<ruby>深<rt>ふか</rt></ruby>い<ruby>森<rt>もり</rt></ruby>",
    "<ruby>山道<rt>やまみち</rt></ruby>",
    "<ruby>洞窟<rt>どうくつ</rt></ruby>",
    "<ruby>城下町<rt>じょうかまち</rt></ruby>",
    "<ruby>王<rt>おう</rt></ruby>の<ruby>城<rt>しろ</rt></ruby>"
  ];
  const horizon = 100;

  // 背景を描くヘルパー関数群は bgTargetCtx に向けて描画する。
  // renderLoop() から毎フレーム直接呼ぶのではなく、レベルが変わった時だけ
  // オフスクリーンキャンバス(bgCache)に一度だけ焼き込み、通常フレームでは
  // それを drawImage するだけにして描画負荷を下げる。
  let bgTargetCtx = ctx;

  function drawCloud(x, y) {
    bgTargetCtx.beginPath();
    bgTargetCtx.arc(x, y, 8, 0, Math.PI * 2);
    bgTargetCtx.arc(x + 10, y - 4, 10, 0, Math.PI * 2);
    bgTargetCtx.arc(x + 20, y, 8, 0, Math.PI * 2);
    bgTargetCtx.fill();
  }

  function drawHouse(x, y, w, h, wallColor, roofColor) {
    bgTargetCtx.fillStyle = wallColor;
    bgTargetCtx.fillRect(x, y, w, h);
    bgTargetCtx.fillStyle = roofColor;
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x - 4, y);
    bgTargetCtx.lineTo(x + w / 2, y - 14);
    bgTargetCtx.lineTo(x + w + 4, y);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawTree(x, groundY, size) {
    bgTargetCtx.fillStyle = "#5a3a22";
    bgTargetCtx.fillRect(x + size * 0.4, groundY - size * 0.3, size * 0.2, size * 0.3);
    bgTargetCtx.fillStyle = "#2e6b3e";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x, groundY - size * 0.3);
    bgTargetCtx.lineTo(x + size * 0.5, groundY - size * 1.1);
    bgTargetCtx.lineTo(x + size, groundY - size * 0.3);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x + size * 0.12, groundY - size * 0.6);
    bgTargetCtx.lineTo(x + size * 0.5, groundY - size * 1.4);
    bgTargetCtx.lineTo(x + size * 0.88, groundY - size * 0.6);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawStalactite(x, len) {
    bgTargetCtx.fillStyle = "#45454f";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x, 0);
    bgTargetCtx.lineTo(x + 10, 0);
    bgTargetCtx.lineTo(x + 5, len);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawCrystal(x, y, color) {
    bgTargetCtx.save();
    bgTargetCtx.shadowColor = color;
    bgTargetCtx.shadowBlur = 8;
    bgTargetCtx.fillStyle = color;
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x, y - 10);
    bgTargetCtx.lineTo(x + 6, y);
    bgTargetCtx.lineTo(x, y + 10);
    bgTargetCtx.lineTo(x - 6, y);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
    bgTargetCtx.restore();
  }

  function drawCastleTower(x, y, w, h, color) {
    bgTargetCtx.fillStyle = color;
    bgTargetCtx.fillRect(x, y, w, h);
    bgTargetCtx.fillStyle = "#d4af37";
    bgTargetCtx.fillRect(x - 2, y - 10, w + 4, 10);
    bgTargetCtx.fillStyle = "#c0392b";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x + w / 2, y - 24);
    bgTargetCtx.lineTo(x + w / 2, y - 10);
