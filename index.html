<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>越えロード｜ドット絵RPGヒーロー育成</title>
  <!-- フォントは非ブロッキングで読み込む。@importやheadでのrel=stylesheetは、
       その読み込みが終わるまで後続のスクリプト実行をブロックすることがあるため、
       print用として読み込んでからonloadでallに切り替える方式にしている。
       万が一フォントが読み込めなくても、下のフォールバック(monospace)で表示は継続する。 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" media="print" onload="this.media='all'">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'DotGothic16', 'MS Gothic', monospace;
      image-rendering: pixelated;
    }

    body {
      background-color: #050510;
      background-image:
        radial-gradient(#1e1e38 15%, transparent 16%),
        radial-gradient(#1e1e38 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #ffffff;
      margin: 0;
      padding: 16px 8px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* ルビ（ふりがな）のスタイリング */
    ruby {
      ruby-align: center;
    }
    rt {
      font-size: 0.65em;
      color: #ffcc00;
      font-weight: normal;
      line-height: 1.2;
    }

    .rpg-window {
      max-width: 460px;
      width: 100%;
      background: #000044;
      border: 4px solid #ffffff;
      outline: 4px solid #000000;
      box-shadow: inset 0 0 0 4px #0000aa, 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 4px;
      padding: 16px;
      position: relative;
    }

    .title-banner {
      text-align: center;
      background: #e60000;
      border: 2px solid #fff;
      color: #ffff00;
      font-size: 20px;
      padding: 6px;
      margin-bottom: 4px;
      text-shadow: 2px 2px #000;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aaaaff;
      margin-bottom: 12px;
    }

    /* 保護者設定バー */
    .parent-bar {
      background: #000022;
      border: 1px dashed #8888ff;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .parent-btn {
      background: #444477;
      border: 1px solid #aaaaff;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 3px;
    }

    /* キャラクター画面を上部固定（Sticky）に設定 */
    .stage {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: #000022;
      border: 3px solid #5555ff;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.9);
    }

    .level-badge {
      display: inline-block;
      background: #ffcc00;
      color: #000;
      font-size: 14px;
      padding: 2px 8px;
      border: 2px solid #fff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .level-badge rt {
      color: #000000;
      font-weight: bold;
    }

    #characterCanvas {
      background: transparent;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 8px rgba(0,255,255,0.4));
    }

    .powering-up #characterCanvas {
      animation: auraGlow 0.3s infinite alternate;
    }

    .leveling-up #characterCanvas {
      animation: auraGlow 0.25s infinite alternate;
    }

    @keyframes auraGlow {
      0% { filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 12px #ffff00); }
      100% { filter: drop-shadow(0 0 16px #ff00ff) drop-shadow(0 0 24px #ffffff); }
    }

    .levelup-banner {
      display: none;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffcc00;
      color: #000;
      font-size: 13px;
      padding: 4px 10px;
      border: 2px solid #fff;
      white-space: nowrap;
      animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -14px); }
    }

    .status-container {
      display: flex;
      justify-content: space-around;
      background: #000;
      border: 2px solid #fff;
      padding: 6px;
      margin-top: 8px;
    }

    .xp-bar-wrap {
      background: #000;
      border: 2px solid #fff;
      height: 12px;
      margin-top: 8px;
      overflow: hidden;
    }

    .xp-bar-fill {
      background: linear-gradient(90deg, #ffcc00, #ff8800);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease-out;
    }

    .xp-label {
      text-align: center;
      font-size: 11px;
      color: #aaaaff;
      margin-top: 4px;
    }

    .status-item {
      text-align: center;
    }

    .status-title {
      font-size: 11px;
      color: #8888ff;
    }

    .status-num {
      font-size: 20px;
      color: #00ffcc;
      text-shadow: 2px 2px #000;
    }

    .input-group {
      background: #000033;
      border: 2px solid #8888ff;
      padding: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #ffff00;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    label:first-child {
      margin-top: 0;
    }

    input[type="text"], select {
      width: 100%;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      background: #000;
      border: 2px solid #fff;
      padding: 8px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.8;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .radio-item:hover {
      background: #111144;
    }

    .radio-item input[type="radio"] {
      margin-right: 8px;
      accent-color: #ffcc00;
      cursor: pointer;
    }

    .example-box {
      font-size: 12px;
      color: #aaaaff;
      margin-bottom: 6px;
      padding-left: 4px;
      line-height: 1.8;
    }

    .caution-box {
      font-size: 11px;
      color: #ff9999;
      margin-top: -4px;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .flex-row {
      display: flex;
      gap: 8px;
    }

    .rpg-btn {
      width: 100%;
      background: #cc0000;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px;
      font-size: 18px;
      cursor: pointer;
      text-shadow: 2px 2px #000;
      box-shadow: 3px 3px 0px #000;
      margin-top: 8px;
    }

    .rpg-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .rpg-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .sub-btn {
      background: #333366;
      border: 2px solid #8888ff;
      color: #ccccff;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      margin-top: 12px;
    }

    .msg-box {
      background: #000;
      border: 3px solid #fff;
      padding: 12px;
      margin-top: 16px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.8;
      transition: border-color 0.2s ease;
    }

    .msg-title {
      color: #ffcc00;
      font-size: 16px;
      margin-bottom: 6px;
      border-bottom: 1px dashed #fff;
      padding-bottom: 4px;
      transition: color 0.2s ease;
    }

    .skill-name {
      color: #00ffcc;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .history-box {
      background: #000022;
      border: 2px solid #5555ff;
      padding: 10px;
      margin-top: 16px;
    }

    .history-title {
      color: #aaaaff;
      font-size: 13px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      padding: 4px 2px;
      border-bottom: 1px dotted #333366;
      color: #ccccdd;
    }

    .history-pt {
      color: #00ffcc;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .history-empty {
      color: #666699;
      font-size: 12px;
      text-align: center;
      padding: 8px 0;
    }

    .loading-note {
      text-align: center;
      font-size: 12px;
      color: #8888ff;
      margin-bottom: 8px;
    }

    .settings-box {
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="rpg-window">
  <div class="title-banner"><ruby>越<rt>こ</rt></ruby>え⚔️ロード</div>
  <div class="subtitle">〜 <ruby>昨日<rt>きのう</rt></ruby>の<ruby>自分<rt>じぶん</rt></ruby>を<ruby>越<rt>こ</rt></ruby>える、<ruby>長岡<rt>ながおか</rt></ruby>ヒーロー<ruby>育成<rt>いくせい</rt></ruby>RPG 〜</div>

  <!-- 保護者設定バー -->
  <div class="parent-bar">
    <span id="lockStatus">🔓 プレイ<ruby>制限<rt>せいげん</rt></ruby>: <ruby>無制限<rt>むせいげん</rt></ruby></span>
    <button class="parent-btn" onclick="toggleParentControl()">🔒 <ruby>保護者<rt>ほごしゃ</rt></ruby><ruby>設定<rt>せってい</rt></ruby></button>
  </div>

  <div class="loading-note" id="loadingNote">セーブデータを<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>み<ruby>中<rt>ちゅう</rt></ruby>...</div>

  <!-- 固定表示されたステージ画面（Sticky） -->
  <div class="stage" id="stage">
    <div class="levelup-banner" id="levelupBanner">★ レベルアップ！ ★</div>
    <div class="level-badge" id="heroTitle"></div>
    <canvas id="characterCanvas" width="288" height="144" style="max-width:100%; height:auto; border:2px solid #333366;"></canvas>

    <div class="xp-bar-wrap">
      <div class="xp-bar-fill" id="xpBarFill"></div>
    </div>
    <div class="xp-label" id="xpLabel">-</div>

    <div class="status-container">
      <div class="status-item">
        <div class="status-title"><ruby>今日<rt>きょう</rt></ruby>のパワー</div>
        <div class="status-num" id="todayPower">-</div>
      </div>
      <div class="status-item">
        <div class="status-title"><ruby>昨日<rt>きのう</rt></ruby>のパワー</div>
        <div class="status-num" id="yesterdayPower">-</div>
      </div>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div class="input-group">
    <label>▶ ヒーローの<ruby>名<rt>な</rt></ruby>まえ</label>
    <input type="text" id="heroName" value="ミライ" placeholder="※ほんみょうはいれないでね">

    <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだカテゴリー</label>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="宿題・勉強" data-label="宿題・勉強" checked>
        <span>【<ruby>学習<rt>がくしゅう</rt></ruby>】<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>・<ruby>習<rt>なら</rt></ruby>い<ruby>事<rt>ごと</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="お手伝い" data-label="お手伝い">
        <span>【<ruby>貢献<rt>こうけん</rt></ruby>】お<ruby>手伝<rt>てつだ</rt></ruby>い・<ruby>掃除<rt>そうじ</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="運動・健康" data-label="運動・健康">
        <span>【<ruby>体力<rt>たいりょく</rt></ruby>】<ruby>運動<rt>うんどう</rt></ruby>・スポーツ・<ruby>早<rt>はや</rt></ruby><ruby>起<rt>お</rt></ruby>き</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="読書" data-label="読書">
        <span>【<ruby>知識<rt>ちしき</rt></ruby>】<ruby>読書<rt>どくしょ</rt></ruby>（<ruby>本<rt>ほん</rt></ruby>・<ruby>図鑑<rt>ずかん</rt></ruby>）</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="休養・自由時間" data-label="休養・自由時間">
        <span>【<ruby>休養<rt>きゅうよう</rt></ruby>】ゲーム・<ruby>漫画<rt>まんが</rt></ruby>・<ruby>昼寝<rt>ひるね</rt></ruby></span>
      </label>
    </div>

    <div class="flex-row">
      <div style="flex: 1;">
        <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだ<ruby>時間<rt>じかん</rt></ruby></label>
        <select id="actionTime">
          <option value="5" selected>5分間</option>
          <option value="10">10分間</option>
          <option value="15">15分間</option>
          <option value="30">30分間</option>
          <option value="45">45分間</option>
          <option value="60">60分以上</option>
        </select>
      </div>
    </div>

    <label>▶ <ruby>詳<rt>くわ</rt></ruby>しい<ruby>内容<rt>ないよう</rt></ruby>（メモ）</label>
    <div class="example-box">
      <ruby>例<rt>れい</rt></ruby>：<ruby>漢字<rt>かんじ</rt></ruby>ドリル／<ruby>皿洗<rt>さらあら</rt></ruby>い／<ruby>走<rt>はし</rt></ruby>り<ruby>込<rt>こ</rt></ruby>み
    </div>
    <input type="text" id="actionDetail" placeholder="なにをしたか入力してね">
    <div class="caution-box">※<ruby>名前<rt>なまえ</rt></ruby>や<ruby>住所<rt>じゅうしょ</rt></ruby>など<ruby>個人情報<rt>こじんじょうほう</rt></ruby>は<ruby>書<rt>か</rt></ruby>かないでね</div>

    <button class="rpg-btn" id="powerUpBtn" onclick="executePowerUp()" disabled>⚔️ パワーアップ！</button>
  </div>

  <!-- メッセージ表示エリア（入力フォーム直下に配置） -->
  <div class="msg-box" id="msgBox">
    <div class="msg-title" id="msgTitle">★ <ruby>判定<rt>はんてい</rt></ruby><ruby>結果<rt>けっか</rt></ruby></div>
    <div class="skill-name" id="skillName"></div>
    <div id="msgContent"></div>
  </div>

  <!-- 履歴 -->
  <div class="history-box">
    <div class="history-title">
      <span>📜 ぼうけんの<ruby>記録<rt>きろく</rt></ruby></span>
      <span id="historyCount"></span>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">まだ<ruby>記録<rt>きろく</rt></ruby>がありません</div>
    </div>
  </div>

  <!-- データリセットボタン -->
  <div class="settings-box">
    <button class="sub-btn" style="width: 100%;" onclick="resetHero()">🔄 このヒーローのデータをリセット</button>
  </div>

</div>

<script>
  const canvas = document.getElementById('characterCanvas');
  const ctx = canvas.getContext('2d');

  const PARENT_PIN = "361";

  let state = {
    power: 0,
    todayPower: 0,
    yesterdayPower: 0,
    history: [],
    parentLock: false,
    categoryCounts: {},
    lastPlayDate: "",
    lastSkill: "",
    lastMsg: ""
  };

  let currentHeroKey = null;
  let currentLevel = 1;

  // ── ユーティリティ ────────────────────────────────────────
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // 日付をまたいだ場合、todayPowerをyesterdayPowerへ繰り上げる。
  // loadHero() / executePowerUp() の両方から同じ関数を呼ぶことで、
  // 「読み込み時に繰り上げたのに保存されず、次の操作でもう一度繰り上がって
  // 前日の記録が消える」問題を防ぐ。戻り値は「繰り上げが発生したか」。
  function handleDayRollover() {
    const today = getTodayStr();
    if (state.lastPlayDate && state.lastPlayDate !== today) {
      state.yesterdayPower = state.todayPower;
      state.todayPower = 0;
      state.categoryCounts = {};
      state.lastPlayDate = today;
      return true;
    } else if (!state.lastPlayDate) {
      state.lastPlayDate = today;
    }
    return false;
  }

  // 背景描画
  const SCENE_NAMES = [
    "<ruby>村<rt>むら</rt></ruby>はずれ",
    "<ruby>町<rt>まち</rt></ruby>なか",
    "<ruby>森<rt>もり</rt></ruby>の<ruby>入口<rt>いりぐち</rt></ruby>",
    "<ruby>深<rt>ふか</rt></ruby>い<ruby>森<rt>もり</rt></ruby>",
    "<ruby>山道<rt>やまみち</rt></ruby>",
    "<ruby>洞窟<rt>どうくつ</rt></ruby>",
    "<ruby>城下町<rt>じょうかまち</rt></ruby>",
    "<ruby>王<rt>おう</rt></ruby>の<ruby>城<rt>しろ</rt></ruby>"
  ];
  const horizon = 100;

  // 背景を描くヘルパー関数群は bgTargetCtx に向けて描画する。
  // renderLoop() から毎フレーム直接呼ぶのではなく、レベルが変わった時だけ
  // オフスクリーンキャンバス(bgCache)に一度だけ焼き込み、通常フレームでは
  // それを drawImage するだけにして描画負荷を下げる。
  let bgTargetCtx = ctx;

  function drawCloud(x, y) {
    bgTargetCtx.beginPath();
    bgTargetCtx.arc(x, y, 8, 0, Math.PI * 2);
    bgTargetCtx.arc(x + 10, y - 4, 10, 0, Math.PI * 2);
    bgTargetCtx.arc(x + 20, y, 8, 0, Math.PI * 2);
    bgTargetCtx.fill();
  }

  function drawHouse(x, y, w, h, wallColor, roofColor) {
    bgTargetCtx.fillStyle = wallColor;
    bgTargetCtx.fillRect(x, y, w, h);
    bgTargetCtx.fillStyle = roofColor;
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x - 4, y);
    bgTargetCtx.lineTo(x + w / 2, y - 14);
    bgTargetCtx.lineTo(x + w + 4, y);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawTree(x, groundY, size) {
    bgTargetCtx.fillStyle = "#5a3a22";
    bgTargetCtx.fillRect(x + size * 0.4, groundY - size * 0.3, size * 0.2, size * 0.3);
    bgTargetCtx.fillStyle = "#2e6b3e";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x, groundY - size * 0.3);
    bgTargetCtx.lineTo(x + size * 0.5, groundY - size * 1.1);
    bgTargetCtx.lineTo(x + size, groundY - size * 0.3);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x + size * 0.12, groundY - size * 0.6);
    bgTargetCtx.lineTo(x + size * 0.5, groundY - size * 1.4);
    bgTargetCtx.lineTo(x + size * 0.88, groundY - size * 0.6);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawStalactite(x, len) {
    bgTargetCtx.fillStyle = "#45454f";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x, 0);
    bgTargetCtx.lineTo(x + 10, 0);
    bgTargetCtx.lineTo(x + 5, len);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawCrystal(x, y, color) {
    bgTargetCtx.save();
    bgTargetCtx.shadowColor = color;
    bgTargetCtx.shadowBlur = 8;
    bgTargetCtx.fillStyle = color;
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x, y - 10);
    bgTargetCtx.lineTo(x + 6, y);
    bgTargetCtx.lineTo(x, y + 10);
    bgTargetCtx.lineTo(x - 6, y);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
    bgTargetCtx.restore();
  }

  function drawCastleTower(x, y, w, h, color) {
    bgTargetCtx.fillStyle = color;
    bgTargetCtx.fillRect(x, y, w, h);
    bgTargetCtx.fillStyle = "#d4af37";
    bgTargetCtx.fillRect(x - 2, y - 10, w + 4, 10);
    bgTargetCtx.fillStyle = "#c0392b";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(x + w / 2, y - 24);
    bgTargetCtx.lineTo(x + w / 2, y - 10);
    bgTargetCtx.lineTo(x + w / 2 + 14, y - 16);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawMountain(baseX, baseY, w, h, color) {
    bgTargetCtx.fillStyle = color;
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(baseX, baseY);
    bgTargetCtx.lineTo(baseX + w / 2, baseY - h);
    bgTargetCtx.lineTo(baseX + w, baseY);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
    bgTargetCtx.fillStyle = "#ffffff";
    bgTargetCtx.beginPath();
    bgTargetCtx.moveTo(baseX + w / 2 - 8, baseY - h + 14);
    bgTargetCtx.lineTo(baseX + w / 2, baseY - h);
    bgTargetCtx.lineTo(baseX + w / 2 + 8, baseY - h + 14);
    bgTargetCtx.closePath();
    bgTargetCtx.fill();
  }

  function drawBackground(level) {
    const w = canvas.width, h = canvas.height;
    bgTargetCtx.clearRect(0, 0, w, h);

    if (level === 1) {
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#6ec6ff"); g.addColorStop(1, "#cdeeff");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);
      bgTargetCtx.fillStyle = "#ffffff";
      drawCloud(40, 22); drawCloud(150, 16); drawCloud(230, 30);
      bgTargetCtx.fillStyle = "#5cb85c";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      drawHouse(232, horizon - 26, 26, 26, "#d98c4a", "#8b3a2f");
    } else if (level === 2) {
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#ffb870"); g.addColorStop(1, "#ffe1b0");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);
      bgTargetCtx.fillStyle = "#b8ae9c";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      bgTargetCtx.fillStyle = "#8f8574";
      bgTargetCtx.fillRect(0, horizon + 20, w, 6);
      const houseColors = [["#e0a458", "#8c4a2f"], ["#c9d6df", "#5c6b73"], ["#e3b7a0", "#7a4a3a"]];
      let hx = 6;
      for (let i = 0; i < 4; i++) {
        const [wall, roof] = houseColors[i % houseColors.length];
        drawHouse(hx, horizon - 24, 26, 26, wall, roof);
        hx += 72;
      }
    } else if (level === 3) {
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#8fd6a0"); g.addColorStop(1, "#c7ecc9");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);
      bgTargetCtx.fillStyle = "#3f9a4e";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      [20, 110, 200, 260].forEach((x, i) => drawTree(x, horizon - 4, 26));
    } else if (level === 4) {
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#1c3a30"); g.addColorStop(1, "#335c46");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);
      bgTargetCtx.fillStyle = "#132a1c";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      [4, 34, 64, 96, 128, 158, 190, 220, 250, 275].forEach((x, i) => drawTree(x, horizon - 2, i % 2 === 0 ? 36 : 28));
    } else if (level === 5) {
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#8fb8e6"); g.addColorStop(1, "#e6d3b3");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);
      drawMountain(-10, horizon, 140, 60, "#7c93a8");
      drawMountain(110, horizon, 150, 76, "#647d94");
      drawMountain(220, horizon, 120, 54, "#8393a4");
      bgTargetCtx.fillStyle = "#a99274";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      bgTargetCtx.fillStyle = "#c8b494";
      bgTargetCtx.fillRect(0, horizon + 16, w, 8);
    } else if (level === 6) {
      bgTargetCtx.fillStyle = "#14141f";
      bgTargetCtx.fillRect(0, 0, w, horizon);
      bgTargetCtx.fillStyle = "#33333d";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      [20, 60, 100, 150, 190, 230, 260].forEach((x, i) => drawStalactite(x, i % 2 === 0 ? 26 : 16));
      drawCrystal(70, horizon - 4, "#66e0ff");
      drawCrystal(180, horizon - 2, "#c77dff");
      drawCrystal(230, horizon - 6, "#66e0ff");
    } else if (level === 7) {
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#6a4a8a"); g.addColorStop(1, "#e0a8c0");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);
      bgTargetCtx.fillStyle = "#7a7a8c";
      bgTargetCtx.fillRect(0, horizon - 30, w, 30);
      drawCastleTower(6, horizon - 60, 22, 60, "#8a8a9a");
      drawCastleTower(260, horizon - 60, 22, 60, "#8a8a9a");
      bgTargetCtx.fillStyle = "#b8ae9c";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      const houseColors = [["#e0a458", "#8c4a2f"], ["#c9a0d8", "#5c3a6b"]];
      let hx2 = 30;
      for (let i = 0; i < 3; i++) {
        const [wall, roof] = houseColors[i % houseColors.length];
        drawHouse(hx2, horizon - 22, 22, 22, wall, roof);
        hx2 += 80;
      }
    } else {
      // 8: 王の城（最終ステージ：豪華版）
      const g = bgTargetCtx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#190033"); g.addColorStop(0.6, "#400066"); g.addColorStop(1, "#800080");
      bgTargetCtx.fillStyle = g; bgTargetCtx.fillRect(0, 0, w, horizon);

      // 背景のキラキラ星
      const stars = [[20,15], [60,35], [95,12], [140,28], [190,10], [225,32], [270,18]];
      bgTargetCtx.fillStyle = "#ffff99";
      stars.forEach(([sx, sy]) => {
        bgTargetCtx.fillRect(sx, sy, 2, 2);
        bgTargetCtx.fillRect(sx-1, sy+1, 4, 1);
        bgTargetCtx.fillRect(sx+1, sy-1, 1, 4);
      });

      // 床（豪華な赤絨毯と金枠）
      bgTargetCtx.fillStyle = "#500a18";
      bgTargetCtx.fillRect(0, horizon, w, h - horizon);
      bgTargetCtx.fillStyle = "#9e1b32";
      bgTargetCtx.fillRect(0, horizon + 6, w, h - horizon - 6);
      bgTargetCtx.fillStyle = "#ffd700";
      bgTargetCtx.fillRect(0, horizon, w, 4);
      bgTargetCtx.fillRect(0, horizon + 6, w, 2);

      // 城壁ベース
      bgTargetCtx.fillStyle = "#3d3250";
      bgTargetCtx.fillRect(40, horizon - 75, 208, 75);

      // レンガ模様
      bgTargetCtx.fillStyle = "#2c223c";
      for (let y = horizon - 70; y < horizon; y += 12) {
        for (let x = 45; x < 240; x += 24) {
          bgTargetCtx.fillRect(x + ((y % 24 === 0) ? 12 : 0), y, 10, 4);
        }
      }

      // 塔（左右）
      drawCastleTower(10, horizon - 85, 36, 85, "#4d4066");
      drawCastleTower(242, horizon - 85, 36, 85, "#4d4066");

      // 中央大城門
      const gateGrad = bgTargetCtx.createLinearGradient(0, horizon - 50, 0, horizon);
      gateGrad.addColorStop(0, "#d4af37");
      gateGrad.addColorStop(1, "#8b6508");
      bgTargetCtx.fillStyle = gateGrad;
      bgTargetCtx.fillRect(114, horizon - 50, 60, 50);

      // 門のアーチ上部
      bgTargetCtx.beginPath();
      bgTargetCtx.arc(144, horizon - 50, 30, Math.PI, 0);
      bgTargetCtx.fill();

      bgTargetCtx.fillStyle = "#1a0f00";
      bgTargetCtx.fillRect(124, horizon - 40, 40, 40);
      bgTargetCtx.beginPath();
      bgTargetCtx.arc(144, horizon - 40, 20, Math.PI, 0);
      bgTargetCtx.fill();

      // 金の旗と装飾
      bgTargetCtx.fillStyle = "#ffcc00";
      bgTargetCtx.fillRect(52, horizon - 65, 12, 28);
      bgTargetCtx.fillRect(224, horizon - 65, 12, 28);
      bgTargetCtx.fillStyle = "#cc0000";
      bgTargetCtx.fillRect(54, horizon - 63, 8, 24);
      bgTargetCtx.fillRect(226, horizon - 63, 8, 24);

      // ステンドグラス窓
      bgTargetCtx.fillStyle = "#00ffff";
      bgTargetCtx.fillRect(80, horizon - 55, 14, 22);
      bgTargetCtx.fillRect(194, horizon - 55, 14, 22);
      bgTargetCtx.fillStyle = "#ff00ff";
      bgTargetCtx.fillRect(83, horizon - 52, 8, 16);
      bgTargetCtx.fillRect(197, horizon - 52, 8, 16);

      // 中央のオーブ / クリスタル
      drawCrystal(144, horizon - 65, "#00ffff");
    }
  }

  // 背景キャッシュ：レベルが変わった時だけ drawBackground() を実行し、
  // 通常フレームはこのキャンバスを drawImage するだけにして描画負荷を抑える。
  const bgCache = document.createElement('canvas');
  bgCache.width = canvas.width;
  bgCache.height = canvas.height;
  const bgCacheCtx = bgCache.getContext('2d');
  let bgCachedLevel = null;

  function ensureBackgroundCache(level) {
    if (bgCachedLevel === level) return;
    bgTargetCtx = bgCacheCtx;
    drawBackground(level);
    bgTargetCtx = ctx;
    bgCachedLevel = level;
  }

  function drawGoalMarker() {
    const gx = WALK_MAX_X + 16 * SPRITE_P + 4;
    ctx.fillStyle = "#5a3a22";
    ctx.fillRect(gx, horizon - 38, 4, 38);
    ctx.fillStyle = "#ffcc00";
    ctx.beginPath();
    ctx.moveTo(gx + 4, horizon - 38);
    ctx.lineTo(gx + 18, horizon - 32);
    ctx.lineTo(gx + 4, horizon - 26);
    ctx.closePath();
    ctx.fill();
  }

  // 経験値のしきい値（最終レベルは1000〜）
  const LEVEL_THRESHOLDS = [0, 40, 100, 190, 320, 500, 730, 1000];
  const MAX_POWER = 1500; // 1500PTで右端（ゴール）到達

  function levelFromPower(p) {
    let lvl = 1;
    for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
      if (p >= LEVEL_THRESHOLDS[i]) lvl = i + 1;
    }
    return lvl;
  }

  function getPalette(level) {
    const suitByLevel = ["#33cc33", "#2ea86e", "#00cc99", "#00a8c0", "#0066ff", "#5b3df5", "#aa00ff", "#2563eb"];
    const armorByLevel = ["#999999", "#aaaaaa", "#bfbfbf", "#c9b37f", "#d4af37", "#e0c040", "#ffd700", "#ffd700"];
    const capeByLevel = [null, null, null, null, null, "#aa00ff", "#c724a8", "#ff0055"];
    const swordByLevel = ["#ffffff", "#e8e8e8", "#cfd8dc", "#8fd6ff", "#4fc3f7", "#b388ff", "#ff6f91", "#ffd700"];
    return { suit: suitByLevel[level - 1], armor: armorByLevel[level - 1], cape: capeByLevel[level - 1], sword: swordByLevel[level - 1] };
  }

  const BASE_SPRITE = [
    "................", ".....HHHHHH.....", "....HHHHHHHH....", "....SSSSSSSS....",
    "....SSESSSES....", "....SSSSSSSS....", ".....SMMMM......", "....AAASSAAA....",
    "...AAAASSSAAA...", "...A.LLLLLL.A...", ".....LLLLLL.....", ".....LLLLLL....."
  ];
  const LEG_FRAMES = [
    [".....LL..LL.....", ".....LL..LL.....", "....BBB..BBB...."],
    ["....LL....LL....", "....LL....LL....", "...BBB....BBB..."]
  ];

  function drawSprite(level, ox, oy, p, legFrame, mirrored) {
    const pal = getPalette(level);
    const c = {
      skin: "#ffcc99", hair: "#663300", eye: "#000000",
      suit: pal.suit, armor: pal.armor, cape: pal.cape,
      boots: "#4a2c17", sword: pal.sword, gold: "#ffcc00"
    };
    const sprite = BASE_SPRITE.concat(LEG_FRAMES[legFrame % 2]);

    ctx.save();
    ctx.translate(ox, oy);
    if (mirrored) {
      ctx.translate(16 * p, 0);
      ctx.scale(-1, 1);
    }

    if (level >= 8) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = c.gold;
      ctx.beginPath();
      ctx.arc(8 * p, 8 * p, 9 * p, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (c.cape) {
      ctx.fillStyle = c.cape;
      ctx.beginPath();
      ctx.moveTo(3 * p, 6 * p);
      ctx.lineTo(13 * p, 6 * p);
      ctx.lineTo(15 * p, 14.5 * p);
      ctx.lineTo(1 * p, 14.5 * p);
      ctx.closePath();
      ctx.fill();
    }

    // 本体の輪郭線：シルエットの外側の境界だけに1px分の縁取りを敷く（剣の縁取りと同じ太さ）
    function isFilled(r, col) {
      if (r < 0 || r >= sprite.length || col < 0 || col > 15) return false;
      return sprite[r][col] !== ".";
    }
    ctx.fillStyle = "#14141f";
    for (let r = 0; r < sprite.length; r++) {
      for (let col = 0; col < 16; col++) {
        if (sprite[r][col] === ".") continue;
        if (!isFilled(r - 1, col)) ctx.fillRect(col * p, r * p - 1, p, 1);
        if (!isFilled(r + 1, col)) ctx.fillRect(col * p, r * p + p, p, 1);
        if (!isFilled(r, col - 1)) ctx.fillRect(col * p - 1, r * p, 1, p);
        if (!isFilled(r, col + 1)) ctx.fillRect(col * p + p, r * p, 1, p);
      }
    }

    for (let r = 0; r < sprite.length; r++) {
      for (let col = 0; col < 16; col++) {
        const char = sprite[r][col];
        if (char === ".") continue;
        if (char === "H") ctx.fillStyle = c.hair;
        if (char === "S") ctx.fillStyle = c.skin;
        if (char === "E") ctx.fillStyle = c.eye;
        if (char === "M") ctx.fillStyle = "#ff6666";
        if (char === "A") ctx.fillStyle = c.armor;
        if (char === "L") ctx.fillStyle = c.suit;
        if (char === "B") ctx.fillStyle = c.boots;
        ctx.fillRect(col * p, r * p, p, p);
      }
    }

    if (level >= 2) {
      ctx.save();
      if (level >= 8) {
        ctx.shadowColor = c.sword;
        ctx.shadowBlur = 6;
      }
      // 縁取り：背景色と同化しないよう、刃と柄の周囲に濃紺の輪郭を先に敷く
      ctx.fillStyle = "#1a1a2e";
      ctx.fillRect(12 * p - 1, 4 * p - 1, 2 * p + 2, 8 * p + 2);
      ctx.fillRect(11 * p - 1, 8 * p - 1, 4 * p + 2, 2 * p + 2);

      ctx.fillStyle = c.sword;
      ctx.fillRect(12 * p, 4 * p, 2 * p, 8 * p);
      ctx.fillStyle = c.gold;
      ctx.fillRect(11 * p, 8 * p, 4 * p, 2 * p);
      ctx.restore();
    }

    if (level >= 8) {
      ctx.fillStyle = c.gold;
      ctx.fillRect(5 * p, 0, p, p * 0.6);
      ctx.fillRect(7 * p, 0, p, p * 0.6);
      ctx.fillRect(9 * p, 0, p, p * 0.6);
    }

    ctx.restore();
  }

  const SPRITE_P = 5;
  const SPRITE_ROWS = 15; // BASE_SPRITE(12) + LEG_FRAMES(3)。ブーツの下に空白行を残さないための実測値
  const WALK_MIN_X = 20;
  const WALK_MAX_X = canvas.width - 24 - 16 * SPRITE_P;
  const WALK_SPEED = 55;
  let walkX = WALK_MIN_X;
  let targetX = WALK_MIN_X;
  let legFrame = 0;
  let legToggleAccum = 0;
  let lastFrameTs = 0;
  let bounceStart = null;
  let bounceDuration = 0;
  let loopStarted = false;

  function triggerBounce(duration) {
    bounceStart = performance.now();
    bounceDuration = duration;
  }

  function progressRatio() {
    const lvl = currentLevel;
    if (lvl >= 8) {
      const baseVal = LEVEL_THRESHOLDS[7]; // 1000
      return Math.max(0, Math.min(1, (state.power - baseVal) / (MAX_POWER - baseVal)));
    }
    const lower = LEVEL_THRESHOLDS[lvl - 1];
    const upper = LEVEL_THRESHOLDS[lvl];
    return Math.max(0, Math.min(1, (state.power - lower) / (upper - lower)));
  }

  function updateTargetX() {
    targetX = WALK_MIN_X + progressRatio() * (WALK_MAX_X - WALK_MIN_X);
  }

  function updateXpUI() {
    const fill = document.getElementById('xpBarFill');
    const label = document.getElementById('xpLabel');
    if (currentLevel >= 8) {
      const remaining = Math.max(0, MAX_POWER - state.power);
      const pct = Math.min(100, Math.floor(((state.power - 1000) / (MAX_POWER - 1000)) * 100));
      fill.style.width = pct + '%';
      if (remaining === 0) {
        label.innerHTML = 'カンスト！ でんせつのヒーロー達成！';
      } else {
        label.innerHTML = `ゴールまで あと ${remaining} pt`;
      }
    } else {
      const upper = LEVEL_THRESHOLDS[currentLevel];
      const lower = LEVEL_THRESHOLDS[currentLevel - 1];
      const pct = Math.min(100, Math.floor(((state.power - lower) / (upper - lower)) * 100));
      fill.style.width = pct + '%';
      label.innerHTML = `つぎのレベルまで あと ${Math.max(0, upper - state.power)} pt`;
    }
  }

  function renderLoop(ts) {
    if (!lastFrameTs) lastFrameTs = ts;
    const dt = ts - lastFrameTs;
    lastFrameTs = ts;

    if (Math.abs(targetX - walkX) > 0.5) {
      const step = WALK_SPEED * (dt / 1000);
      walkX = (targetX > walkX) ? Math.min(targetX, walkX + step) : Math.max(targetX, walkX - step);
      legToggleAccum += dt;
      if (legToggleAccum > 140) { legFrame = legFrame === 0 ? 1 : 0; legToggleAccum = 0; }
    } else {
      walkX = targetX;
      legFrame = 0;
    }

    let bounceOffset = 0;
    if (bounceStart !== null) {
      const elapsed = ts - bounceStart;
      if (elapsed < bounceDuration) {
        bounceOffset = -Math.abs(Math.sin((elapsed / bounceDuration) * Math.PI)) * 14;
      } else {
        bounceStart = null;
      }
    }

    ensureBackgroundCache(currentLevel);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bgCache, 0, 0);
    drawGoalMarker();
    const spriteY = horizon - SPRITE_ROWS * SPRITE_P + bounceOffset;
    drawSprite(currentLevel, walkX, spriteY, SPRITE_P, legFrame, false);

    requestAnimationFrame(renderLoop);
  }

  function startAnimationLoop() {
    if (loopStarted) return;
    loopStarted = true;
    requestAnimationFrame(renderLoop);
  }

  function updateTitle(lvl) {
    const titles = [
      "LV.1 <ruby>見習<rt>みなら</rt></ruby>い<ruby>勇者<rt>ゆうしゃ</rt></ruby>",
      "LV.2 かけだし<ruby>戦士<rt>せんし</rt></ruby>",
      "LV.3 もりの<ruby>狩人<rt>かりうど</rt></ruby>",
      "LV.4 <ruby>森<rt>もり</rt></ruby>の<ruby>賢者<rt>けんじゃ</rt></ruby>",
      "LV.5 <ruby>山<rt>やま</rt></ruby>の<ruby>探検家<rt>たんけんか</rt></ruby>",
      "LV.6 <ruby>洞窟<rt>どうくつ</rt></ruby>の<ruby>勇士<rt>ゆうし</rt></ruby>",
      "LV.7 <ruby>王国<rt>おうこく</rt></ruby>の<ruby>騎士<rt>きし</rt></ruby>",
      "LV.8 でんせつのヒーロー"
    ];
    document.getElementById('heroTitle').innerHTML = titles[lvl - 1] + `（${SCENE_NAMES[lvl - 1]}）`;
  }

  function play8BitSound(isHigh) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (isHigh) {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else {
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.setValueAtTime(150, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    } catch(e) {}
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    const count = document.getElementById('historyCount');
    const entries = state.history.slice(0, 8);
    count.innerHTML = state.history.length > 0 ? `<ruby>全<rt>ぜん</rt></ruby>${state.history.length}<ruby>件<rt>けん</rt></ruby>` : '';
    if (entries.length === 0) {
      list.innerHTML = '<div class="history-empty">まだ<ruby>記録<rt>きろく</rt></ruby>がありません</div>';
      return;
    }
    // e.label はすでにエスケープ済みの文字列として保存されているので、
    // ここでは innerHTML にそのまま差し込んでよい。
    list.innerHTML = entries.map(e => `
      <div class="history-entry">
        <span>${e.label}</span>
        <span class="history-pt">+${e.bonus}PT</span>
      </div>
    `).join('');
  }

  function updateParentLockUI() {
    handleDayRollover();

    const lockStatusEl = document.getElementById('lockStatus');
    const btn = document.getElementById('powerUpBtn');

    if (!state.parentLock) {
      lockStatusEl.innerHTML = "🔓 プレイ<ruby>制限<rt>せいげん</rt></ruby>: <ruby>無制限<rt>むせいげん</rt></ruby>";
    } else {
      lockStatusEl.innerHTML = "🔒 プレイ<ruby>制限<rt>せいげん</rt></ruby>: <ruby>各<rt>かく</rt></ruby>カテゴリ2<ruby>回<rt>かい</rt></ruby>まで";
    }
    btn.disabled = false;
  }

  function toggleParentControl() {
    const inputPin = prompt(`【保護者確認】暗証番号を入力してください。（ヒント：ミライ）`);
    if (inputPin === PARENT_PIN) {
      state.parentLock = !state.parentLock;
      const nextModeText = state.parentLock ? "「各カテゴリ2回まで」" : "「無制限」";
      alert(`プレイ制限を ${nextModeText} に切り替えました。`);
      updateParentLockUI();
      saveHero();

      alert("暗証番号が違います。");
    }
  }

  function heroStorageKey(name) {
    return 'hero:' + name.trim();
  }

  // ── 保存先 ─────────────────────────────────────────────
  // GitHub Pages公開のみを前提に localStorage を直接使用する（同期処理でほぼ瞬時）。
  function storageGet(key) {
    try { return Promise.resolve(localStorage.getItem(key)); } catch (e) { return Promise.resolve(null); }
  }

  // 何らかの理由でlocalStorageアクセスが極端に遅い/返ってこない場合の保険。
  // 一定時間で諦めて null（＝データなし扱い）を返し、アプリが固まらないようにする。
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(resolve => setTimeout(() => resolve(null), ms))
    ]);
  }

  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
    return Promise.resolve();
  }

  function storageDelete(key) {
    try { localStorage.removeItem(key); } catch (e) {}
    return Promise.resolve();
  }

  async function loadHero() {
    const nameInput = document.getElementById('heroName');
    const name = nameInput.value.trim() || 'ヒーロー';
    const key = heroStorageKey(name);
    document.getElementById('loadingNote').style.display = 'block';
    document.getElementById('powerUpBtn').disabled = true;

    // ストレージの応答を待つ前に、まずデフォルト状態でステージ（背景＋キャラクター）を
    // 表示しておく。実際のセーブデータが届き次第、数値だけ差し替える。
    currentLevel = levelFromPower(state.power);
    updateTitle(currentLevel);
    updateXpUI();
    walkX = WALK_MIN_X;
    updateTargetX();
    startAnimationLoop();

    try {
      const value = await withTimeout(storageGet(key), 4000);
      if (value) {
        const parsed = JSON.parse(value);
        state = {
          power: parsed.power || 0,
          todayPower: parsed.todayPower || 0,
          yesterdayPower: parsed.yesterdayPower || 0,
          history: parsed.history || [],
          parentLock: parsed.parentLock !== undefined ? parsed.parentLock : false,
          categoryCounts: parsed.categoryCounts || {},
          lastPlayDate: parsed.lastPlayDate || "",
          lastSkill: parsed.lastSkill || "",
          lastMsg: parsed.lastMsg || ""
        };
      } else {
        state = { power: 0, todayPower: 0, yesterdayPower: 0, history: [], parentLock: false, categoryCounts: {}, lastPlayDate: "", lastSkill: "", lastMsg: "" };
      }
    } catch (e) {
      state = { power: 0, todayPower: 0, yesterdayPower: 0, history: [], parentLock: false, categoryCounts: {}, lastPlayDate: "", lastSkill: "", lastMsg: "" };
    }

    // 日付をまたいでいたら繰り上げる（発生した場合はここで確定保存する。
    // これにより executePowerUp() 側で二重に繰り上がることがなくなる）
    const rolledOver = handleDayRollover();

    currentHeroKey = key;
    currentLevel = levelFromPower(state.power);
    document.getElementById('todayPower').textContent = state.todayPower;
    document.getElementById('yesterdayPower').textContent = state.yesterdayPower;
    updateTitle(currentLevel);
    updateXpUI();
    walkX = WALK_MIN_X;
    updateTargetX();
    renderHistory();
    updateParentLockUI();
    document.getElementById('loadingNote').style.display = 'none';

    if (rolledOver) {
      await saveHero();
    }
  }

  async function saveHero() {
    if (!currentHeroKey) return;
    await storageSet(currentHeroKey, JSON.stringify(state));
  }

  async function resetHero() {
    if (!currentHeroKey) return;
    if (!confirm('このヒーローの記録をすべて消しますか？')) return;
    await storageDelete(currentHeroKey);

    // フォーム入力欄・判定メッセージ欄・数値の完全初期化
    const firstRadio = document.querySelector('input[name="actionCategory"][value="宿題・勉強"]');
    if (firstRadio) firstRadio.checked = true;

    document.getElementById('actionTime').value = "5";
    document.getElementById('actionDetail').value = "";

    const msgBox = document.getElementById('msgBox');
    msgBox.style.display = 'none';
    document.getElementById('skillName').innerHTML = "";
    document.getElementById('msgContent').innerHTML = "";

    await loadHero();
  }

  async function executePowerUp() {
    handleDayRollover();

    const selectedRadio = document.querySelector('input[name="actionCategory"]:checked');
    const category = selectedRadio ? selectedRadio.value : "宿題・勉強";

    const catRubyNames = {
      "宿題・勉強": "「【<ruby>学習<rt>がくしゅう</rt></ruby>】<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>・<ruby>習<rt>なら</rt></ruby>い<ruby>事<rt>ごと</rt></ruby>」",
      "お手伝い": "「【<ruby>貢献<rt>こうけん</rt></ruby>】お<ruby>手伝<rt>てつだ</rt></ruby>い・<ruby>掃除<rt>そうじ</rt></ruby>」",
      "運動・健康": "「【<ruby>体力<rt>たいりょく</rt></ruby>】<ruby>運動<rt>うんどう</rt></ruby>・スポーツ・<ruby>早<rt>はや</rt></ruby><ruby>起<rt>お</rt></ruby>き」",
      "読書": "「【<ruby>知識<rt>ちしき</rt></ruby>】<ruby>読書<rt>どくしょ</rt></ruby>」",
      "休養・自由時間": "「【<ruby>休養<rt>きゅうよう</rt></ruby>】ゲーム・<ruby>漫画<rt>まんが</rt></ruby>・<ruby>昼寝<rt>ひるね</rt></ruby>」"
    };

    const msgBox = document.getElementById('msgBox');
    const msgTitle = document.getElementById('msgTitle');

    if (state.parentLock) {
      const currentCount = state.categoryCounts[category] || 0;
      if (currentCount >= 2) {
        msgBox.style.borderColor = "#ff4d4d";
        msgTitle.style.color = "#ff4d4d";
        msgTitle.innerHTML = "⚠️ <ruby>回数<rt>かいすう</rt></ruby><ruby>制限<rt>せいげん</rt></ruby>のおしらせ";
        document.getElementById('skillName').innerHTML = "";
        document.getElementById('msgContent').innerHTML = `${catRubyNames[category] || category}は<ruby>本日<rt>ほんじつ</rt></ruby>すでに2<ruby>回<rt>かい</rt></ruby>おこないました。<ruby>他<rt>ほか</rt></ruby>のカテゴリーを<ruby>選<rt>えら</rt></ruby>ぶか、<ruby>明日<rt>あした</rt></ruby>また<ruby>挑戦<rt>ちょうせん</rt></ruby>してね！`;
        msgBox.style.display = 'block';
        msgBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
    }

    msgBox.style.borderColor = "#ffffff";
    msgTitle.style.color = "#ffcc00";

    const btn = document.getElementById('powerUpBtn');
    btn.disabled = true;

    const timeMinutes = parseInt(document.getElementById('actionTime').value) || 5;
    const rawDetail = document.getElementById('actionDetail').value.trim();
    const rawName = document.getElementById('heroName').value || "ヒーロー";

    // 表示（innerHTML）に使うのはエスケープ済みの値。キーワード判定には元の文字列を使う。
    const safeDetail = escapeHtml(rawDetail);
    const safeName = escapeHtml(rawName);

    const text = rawDetail.toLowerCase();
    const lowKeywords = ["漫画", "マンガ", "まんが", "コミック", "昼寝", "ひるね", "寝た", "ねた", "ごろごろ", "ゴロゴロ", "ゲーム", "テレビ", "さぼ", "サボ", "何もしない", "スマホ", "youtube"];
    const isLowText = lowKeywords.some(kw => text.includes(kw));

    let bonus = 0;
    let skill = "";
    let title = "";
    let msg = "";

    const isRest = (category === "休養・自由時間" || isLowText);

    const skillsMap = {
      "宿題・勉強": [
        "<ruby>集中<rt>しゅうちゅう</rt></ruby>ドリル<ruby>斬<rt>ぎ</rt></ruby>り",
        "ブレイン・スマッシュ",
        "<ruby>閃光<rt>せんこう</rt></ruby>スタディ・バースト",
        "<ruby>知恵<rt>ちえ</rt></ruby>のメテオストライク"
      ],
      "お手伝い": [
        "ピカピカクリーンブレイク",
        "おたすけハリケーン",
        "サンキュー・エクスプロージョン",
        "<ruby>奉仕<rt>ほうし</rt></ruby>のホーリーレイ"
      ],
      "運動・健康": [
        "<ruby>爆速<rt>ばくそく</rt></ruby>ダッシュストライク",
        "マッスル・ボルケーノ",
        "<ruby>健康<rt>けんこう</rt></ruby>パワースマッシュ",
        "エナジー・トルネード"
      ],
      "読書": [
        "ナレッジウェーブ",
        "イマジネーション・ダイブ",
        "ブック・オブ・ジャッジメント",
        "<ruby>知能<rt>ちのう</rt></ruby>フレア"
      ],
      "休養・自由時間": [
        "すやすやパワー<ruby>充電<rt>じゅうでん</rt></ruby>",
        "リラックス・ヒール",
        "のんびりサンクチュアリ",
        "まったりオーラ・リカバリー"
      ]
    };

    let skillPool = isRest ? skillsMap["休養・自由時間"] : (skillsMap[category] || ["ミライヒーロー<ruby>斬<rt>ぎ</rt></ruby>り", "<ruby>勇気<rt>ゆうき</rt></ruby>の<ruby>一撃<rt>いちげき</rt></ruby>"]);
    let availableSkills = skillPool.filter(s => s !== state.lastSkill);
    if (availableSkills.length === 0) availableSkills = skillPool;
    skill = availableSkills[Math.floor(Math.random() * availableSkills.length)];
    state.lastSkill = skill;

    if (isRest) {
      bonus = 2;
      title = "💤 <ruby>体力<rt>たいりょく</rt></ruby>を<ruby>回復<rt>かいふく</rt></ruby>した！ (+2 PT)";
      msg = getRandomMessage(true, safeName, category, safeDetail, timeMinutes);
      play8BitSound(false);
    } else {
      bonus = Math.floor(timeMinutes * 0.45) + 3;
      title = `🔥 <ruby>昨日<rt>きのう</rt></ruby>の<ruby>自分<rt>じぶん</rt></ruby>を<ruby>越<rt>こ</rt></ruby>えた！ (+${bonus} PT)`;
      msg = getRandomMessage(false, safeName, category, safeDetail, timeMinutes);
      play8BitSound(true);
    }

    state.categoryCounts[category] = (state.categoryCounts[category] || 0) + 1;

    state.power += bonus;
    state.todayPower += bonus;

    const catLabels = {
      "宿題・勉強": "<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>",
      "お手伝い": "お<ruby>手伝<rt>てつだ</rt></ruby>い",
      "運動・健康": "<ruby>運動<rt>うんどう</rt></ruby>・<ruby>健康<rt>けんこう</rt></ruby>",
      "読書": "<ruby>読書<rt>どくしょ</rt></ruby>",
      "休養・自由時間": "<ruby>休養<rt>きゅうよう</rt></ruby>・<ruby>自由時間<rt>じゆうじかん</rt></ruby>"
    };

    // 履歴に保存する label もエスケープ済みの safeDetail を使う
    state.history.unshift({
      label: `${catLabels[category] || category}${safeDetail ? '（' + safeDetail + '）' : ''} / ${timeMinutes}<ruby>分<rt>ふん</rt></ruby>`,
      bonus: bonus
    });
    state.history = state.history.slice(0, 30);

    document.getElementById('todayPower').textContent = state.todayPower;
    document.getElementById('yesterdayPower').textContent = state.yesterdayPower;
    msgTitle.innerHTML = title;

    document.getElementById('skillName').innerHTML = `⚔️ ひっさつわざ：「${skill}」`;
    document.getElementById('msgContent').innerHTML = msg;
    msgBox.style.display = 'block';

    msgBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    renderHistory();

    const stage = document.getElementById('stage');
    const newLevel = levelFromPower(state.power);
    const leveledUp = newLevel > currentLevel;

    stage.classList.add(leveledUp ? 'leveling-up' : 'powering-up');
    triggerBounce(leveledUp ? 1600 : 900);
    if (leveledUp) {
      const banner = document.getElementById('levelupBanner');
      banner.innerHTML = `★ ${SCENE_NAMES[newLevel - 1]}に<ruby>到着<rt>とうちゃく</rt></ruby>！レベルアップ！ ★`;
      banner.style.display = 'block';
      banner.style.animation = 'none';
      void banner.offsetWidth;
      banner.style.animation = '';
      walkX = WALK_MIN_X;
    }

    currentLevel = newLevel;
    updateTitle(currentLevel);
    updateXpUI();
    updateTargetX();

    setTimeout(() => {
      stage.classList.remove('powering-up');
      stage.classList.remove('leveling-up');
    }, leveledUp ? 1600 : 1200);

    await saveHero();
    updateParentLockUI();
  }

  document.getElementById('heroName').addEventListener('change', loadHero);

  loadHero();
</script>
