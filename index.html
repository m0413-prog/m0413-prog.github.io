<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>越え⚔️ロード</title>
  
  <!-- フォント読み込みの非ブロッキング化 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  
  <!-- 剣の絵文字Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>⚔️</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'DotGothic16', monospace;
      image-rendering: pixelated;
    }

    body {
      background-color: #050510;
      background-image:
        radial-gradient(#1e1e38 15%, transparent 16%),
        radial-gradient(#1e1e38 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #ffffff;
      margin: 0;
      padding: 16px 8px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    ruby {
      ruby-align: center;
    }
    rt {
      font-size: 0.65em;
      color: #ffcc00;
      font-weight: normal;
      line-height: 1.2;
    }

    .rpg-window {
      max-width: 460px;
      width: 100%;
      background: #000044;
      border: 4px solid #ffffff;
      outline: 4px solid #000000;
      box-shadow: inset 0 0 0 4px #0000aa, 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 4px;
      padding: 16px;
      position: relative;
    }

    .title-banner {
      text-align: center;
      background: #e60000;
      border: 2px solid #fff;
      color: #ffff00;
      font-size: 22px;
      padding: 6px;
      margin-bottom: 4px;
      text-shadow: 2px 2px #000;
      letter-spacing: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aaaaff;
      margin-bottom: 12px;
    }

    .parent-bar {
      background: #000022;
      border: 1px dashed #8888ff;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .parent-btn {
      background: #444477;
      border: 1px solid #aaaaff;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 3px;
    }

    /* キャラクター画面を上部固定（Sticky）に設定 */
    .stage {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: #000022;
      border: 3px solid #5555ff;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.9);
      transition: filter 0.5s ease;
    }

    .level-badge {
      display: inline-block;
      background: #ffcc00;
      color: #000;
      font-size: 14px;
      padding: 2px 8px;
      border: 2px solid #fff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .level-badge rt {
      color: #000000;
      font-weight: bold;
    }

    #characterCanvas {
      background: transparent;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 8px rgba(0,255,255,0.4));
      transition: filter 0.5s ease;
    }

    .powering-up #characterCanvas {
      animation: auraGlow 0.3s infinite alternate;
    }

    .leveling-up #characterCanvas {
      animation: auraGlow 0.25s infinite alternate;
    }

    @keyframes auraGlow {
      0% { filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 12px #ffff00); }
      100% { filter: drop-shadow(0 0 16px #ff00ff) drop-shadow(0 0 24px #ffffff); }
    }

    /* 昨日超えを達成した日の持続的なヒーロー覚醒オーラ */
    .hero-awakened {
      animation: awakenedGlow 1.5s infinite alternate !important;
    }

    @keyframes awakenedGlow {
      0% { filter: drop-shadow(0 0 6px #ffcc00) drop-shadow(0 0 12px #ff4400); }
      100% { filter: drop-shadow(0 0 16px #ffff00) drop-shadow(0 0 30px #ff00ff); }
    }

    .levelup-banner {
      display: none;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffcc00;
      color: #000;
      font-size: 13px;
      padding: 4px 10px;
      border: 2px solid #fff;
      white-space: nowrap;
      animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -14px); }
    }

    .status-container {
      display: flex;
      justify-content: space-around;
      background: #000;
      border: 2px solid #fff;
      padding: 6px;
      margin-top: 8px;
    }

    .xp-bar-wrap {
      background: #000;
      border: 2px solid #fff;
      height: 12px;
      margin-top: 8px;
      overflow: hidden;
    }

    .xp-bar-fill {
      background: linear-gradient(90deg, #ffcc00, #ff8800);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease-out;
    }

    .xp-label {
      text-align: center;
      font-size: 11px;
      color: #aaaaff;
      margin-top: 4px;
    }

    .status-item {
      text-align: center;
    }

    .status-title {
      font-size: 11px;
      color: #8888ff;
    }

    .status-num {
      font-size: 20px;
      color: #00ffcc;
      text-shadow: 2px 2px #000;
      transition: transform 0.2s ease;
    }

    /* 昨日超越時の特別発光エフェクト（数字） */
    .power-surpassed {
      color: #ffff00 !important;
      text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff8800, 2px 2px #000 !important;
      animation: pulseGlow 1s infinite alternate;
      display: inline-block;
    }
    @keyframes pulseGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); text-shadow: 0 0 15px #ffff00, 0 0 30px #ff00ff, 2px 2px #000; }
    }

    .input-group {
      background: #000033;
      border: 2px solid #8888ff;
      padding: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #ffff00;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    label:first-child {
      margin-top: 0;
    }

    input[type="text"], select {
      width: 100%;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    /* 直列（縦1列）配置 */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      background: #000;
      border: 2px solid #fff;
      padding: 8px;
    }

    .radio-item {
      display: flex;
      align-items: center; 
      cursor: pointer;
      font-size: 13px; 
      line-height: 1.8;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .radio-item:hover {
      background: #111144;
    }

    .radio-item input[type="radio"] {
      margin-right: 8px;
      accent-color: #ffcc00;
      cursor: pointer;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
    }

    .example-box {
      font-size: 12px;
      color: #aaaaff;
      margin-bottom: 6px;
      padding-left: 4px;
      line-height: 1.8;
    }

    .flex-row {
      display: flex;
      gap: 8px;
    }

    .rpg-btn {
      width: 100%;
      background: #cc0000;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px;
      font-size: 18px;
      cursor: pointer;
      text-shadow: 2px 2px #000;
      box-shadow: 3px 3px 0px #000;
      margin-top: 8px;
    }

    .rpg-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .rpg-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .msg-box {
      background: #000;
      border: 3px solid #fff;
      padding: 12px;
      margin-top: 16px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.8;
      transition: border-color 0.2s ease;
    }

    .msg-title {
      color: #ffcc00;
      font-size: 16px;
      margin-bottom: 6px;
      border-bottom: 1px dashed #fff;
      padding-bottom: 4px;
      transition: color 0.2s ease;
    }

    .skill-name {
      color: #00ffcc;
      font-size: 15px;
      margin-bottom: 6px;
    }

    details.rpg-accordion {
      background: #000022;
      border: 2px solid #5555ff;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    
    details.rpg-accordion summary {
      color: #aaaaff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      list-style: none; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details.rpg-accordion summary::-webkit-details-marker {
      display: none; 
    }

    .summary-title::before {
      content: '▶ ';
      font-size: 12px;
      display: inline-block;
    }
    details.rpg-accordion[open] .summary-title::before {
      content: '▼ ';
    }
    details.rpg-accordion[open] summary {
      margin-bottom: 12px;
      border-bottom: 1px dashed #333366;
      padding-bottom: 8px;
    }

    .history-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
      border-bottom: 1px dotted #333366;
      color: #ccccdd;
    }

    .history-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-date {
      color: #8888ff;
      font-size: 10px;
    }

    .history-pt {
      color: #00ffcc;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .history-empty {
      color: #666699;
      font-size: 12px;
      text-align: center;
      padding: 8px 0;
    }

    .sub-btn {
      background: #333366;
      border: 2px solid #8888ff;
      color: #ccccff;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="rpg-window">
  <div class="title-banner">越え⚔️ロード</div>
  <!-- サブタイトルを修正 -->
  <div class="subtitle">〜 <ruby>昨日<rt>きのう</rt></ruby>の<ruby>自分<rt>じぶん</rt></ruby>を<ruby>越<rt>こ</rt></ruby>える、<ruby>長岡<rt>ながおか</rt></ruby>ヒーロー<ruby>育成<rt>いくせい</rt></ruby>RPG 〜</div>
  
  <div class="stage" id="stage">
    <div class="levelup-banner" id="levelupBanner">★ レベルアップ！ ★</div>
    <div class="level-badge" id="heroTitle"></div>
    <canvas id="characterCanvas" width="288" height="144" style="max-width:100%; height:auto; border:2px solid #333366;"></canvas>

    <div class="xp-bar-wrap">
      <div class="xp-bar-fill" id="xpBarFill"></div>
    </div>
    <div class="xp-label" id="xpLabel">-</div>

    <div class="status-container">
      <div class="status-item">
        <div class="status-title"><ruby>今日<rt>きょう</rt></ruby>のパワー</div>
        <div class="status-num" id="todayPower">-</div>
      </div>
      <div class="status-item">
        <div class="status-title"><ruby>昨日<rt>きのう</rt></ruby>のパワー</div>
        <div class="status-num" id="yesterdayPower">-</div>
      </div>
    </div>
  </div>

  <div class="input-group">
    <label style="margin-top: 0;">▶ ヒーローの<ruby>名<rt>な</rt></ruby>まえ</label>
    <input type="text" id="heroName" value="ミライ" placeholder="※ほんみょうはいれないでね">

    <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだカテゴリー</label>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="宿題・勉強" data-label="宿題・勉強" checked>
        <span>【<ruby>学習<rt>がくしゅう</rt></ruby>】<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="お手伝い" data-label="お手伝い">
        <span>【<ruby>貢献<rt>こうけん</rt></ruby>】お<ruby>手伝<rt>てつだ</rt></ruby>い・<ruby>掃除<rt>そうじ</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="運動・健康" data-label="運動・健康">
        <span>【<ruby>体力<rt>たいりょく</rt></ruby>】<ruby>運動<rt>うんどう</rt></ruby>・<ruby>早<rt>はや</rt></ruby><ruby>起<rt>お</rt></ruby>き</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="読書" data-label="読書">
        <span>【<ruby>知識<rt>ちしき</rt></ruby>】<ruby>読書<rt>どくしょ</rt></ruby>・<ruby>図鑑<rt>ずかん</rt></ruby></span>
      </label>
    </div>

    <div class="flex-row">
      <div style="flex: 1;">
        <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだ<ruby>時間<rt>じかん</rt></ruby></label>
        <select id="actionTime">
          <option value="5" selected>5分間</option>
          <option value="10">10分間</option>
          <option value="15">15分間</option>
          <option value="30">30分間</option>
          <option value="45">45分間</option>
          <option value="60">60分以上</option>
        </select>
      </div>
    </div>

    <label>▶ <ruby>詳<rt>くわ</rt></ruby>しい<ruby>内容<rt>ないよう</rt></ruby>（メモ）</label>
    <div class="example-box">
      <ruby>例<rt>れい</rt></ruby>：<ruby>漢字<rt>かんじ</rt></ruby>ドリル／<ruby>皿洗<rt>さらあら</rt></ruby>い／<ruby>走<rt>はし</rt></ruby>り<ruby>込<rt>こ</rt></ruby>み
    </div>
    <input type="text" id="actionDetail" placeholder="なにをしたか入力してね">

    <button class="rpg-btn" id="powerUpBtn" onclick="executePowerUp()">⚔️ パワーアップ！</button>
  </div>

  <div class="msg-box" id="msgBox">
    <div class="msg-title" id="msgTitle">★ <ruby>判定<rt>はんてい</rt></ruby><ruby>結果<rt>けっか</rt></ruby></div>
    <div class="skill-name" id="skillName"></div>
    <div id="msgContent"></div>
  </div>

  <details class="rpg-accordion">
    <summary>
      <span class="summary-title">📜 ぼうけんの<ruby>記録<rt>きろく</rt></ruby>をみる</span>
      <span id="historyCount"></span>
    </summary>
    <div class="history-list" id="historyList">
      <div class="history-empty">まだ<ruby>記録<rt>きろく</rt></ruby>がありません</div>
    </div>
  </details>

  <details class="rpg-accordion" style="border-color: #8888ff;">
    <summary>
      <span class="summary-title">⚙️ ぼうけんのせってい</span>
    </summary>
    <div style="margin-top: 8px;">
      <div class="parent-bar">
        <span id="lockStatus">🔓 プレイ<ruby>制限<rt>せいげん</rt></ruby>: <ruby>無制限<rt>むせいげん</rt></ruby></span>
        <button class="parent-btn" onclick="toggleParentControl()">🔒 <ruby>保護者<rt>ほごしゃ</rt></ruby><ruby>設定<rt>せってい</rt></ruby></button>
      </div>
      <button class="sub-btn" style="width: 100%; margin-top: 0;" onclick="resetHero()">🔄 このヒーローのデータをリセット</button>
      <button class="sub-btn" style="width: 100%; background: #aa00aa; border-color: #ff00ff; color: #ffffff; font-weight: bold; margin-bottom: 4px; margin-top: 16px;" onclick="testFirework()">🎆 花火演出だけをテスト再生する</button>
    </div>
  </details>

</div>

<script>
  const canvas = document.getElementById('characterCanvas');
  const ctx = canvas.getContext('2d');

  const PARENT_PIN = "361";

  let state = {
    power: 0,
    todayPower: 0,
    yesterdayPower: 0,
    surpassedToday: false, 
    history: [],
    parentLock: false,
    categoryCounts: {},
    lastPlayDate: "",
    lastSkill: "",
    lastMsg: ""
  };

  let currentHeroKey = null;
  let currentLevel = 1;

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getDateTimeStr() {
    const d = new Date();
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // ── 長岡花火風エフェクトクラス（花火演出） ──
  class NagaokaFireworksEffect {
    constructor(canvas, ctx) {
      this.canvas = canvas;
      this.ctx = ctx;
      this.particles = [];
      this.active = false;
    }

    start() {
      this.particles = [];
      this.active = true;

      const centerX = this.canvas.width / 2;
      const centerY = this.canvas.height / 3;
      const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#ffffff', '#3498db', '#ff00ff'];

      for (let i = 0; i < 200; i++) {
        const angle = (Math.PI * 2 / 200) * i;
        const speed = Math.random() * 5 + 1; 
        this.particles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() > 0.5 ? 4 : 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }
      playFireworkSound();
    }

    updateAndDraw() {
      if (!this.active) return;
      this.ctx.save();
      let allDead = true;
      this.particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03; 
        p.alpha -= 0.005; 
        if (p.alpha > 0) {
          allDead = false;
          this.ctx.fillStyle = p.color;
          this.ctx.globalAlpha = p.alpha;
          this.ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
      });
      if (allDead) this.active = false;
      this.ctx.restore();
    }
  }

  // ★ 昨日超えを達成した日の継続オーラエフェクト ★
  class AwakenedAuraEffect {
    constructor(canvas, ctx) {
      this.canvas = canvas;
      this.ctx = ctx;
      this.particles = [];
    }

    updateAndDraw() {
      if (this.particles.length < 40) {
        if (Math.random() < 0.3) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: this.canvas.height + 5,
            speed: Math.random() * 0.8 + 0.2,
            size: Math.random() * 3 + 1,
            alpha: 0,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      this.ctx.save();
      const colors = ['#ffcc00', '#ffff99', '#ff9900'];
      for (let i = this.particles.length - 1; i >= 0; i--) {
        let p = this.particles[i];
        p.y -= p.speed;
        p.x += Math.sin(p.y * 0.05 + p.phase) * 0.3; 
        
        if (p.y > this.canvas.height - 20) {
          p.alpha += 0.05;
        } else if (p.y < 30) {
          p.alpha -= 0.03;
        } else {
          p.alpha = 0.8;
        }
        
        this.ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
        this.ctx.fillStyle = colors[i % colors.length];
        this.ctx.fillRect(p.x, p.y, p.size, p.size);

        if (p.alpha <= 0 && p.y < 30) {
          this.particles.splice(i, 1);
        }
      }
      this.ctx.restore();
    }
    
    clear() {
      this.particles = [];
    }
  }

  const fireworks = new NagaokaFireworksEffect(canvas, ctx);
  const auraEffect = new AwakenedAuraEffect(canvas, ctx);

  function playFireworkSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(400, now);
      osc1.frequency.exponentialRampToValueAtTime(800, now + 0.6);
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(0.1, now + 0.1);
      gain1.gain.linearRampToValueAtTime(0.01, now + 0.6);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.6);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(150, now + 0.6);
      osc2.frequency.exponentialRampToValueAtTime(20, now + 2.5);
      gain2.gain.setValueAtTime(0, now + 0.6);
      gain2.gain.setValueAtTime(0.3, now + 0.61); 
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.6);
      osc2.stop(now + 2.5);
    } catch(e) {}
  }

  function play8BitSound(isHigh) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (isHigh) {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else {
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.setValueAtTime(150, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    } catch(e) {}
  }

  const SCENE_NAMES = [
    "<ruby>村<rt>むら</rt></ruby>はずれ", "<ruby>町<rt>まち</rt></ruby>なか",
    "<ruby>森<rt>もり</rt></ruby>の<ruby>入口<rt>いりぐち</rt></ruby>", "<ruby>深<rt>ふか</rt></ruby>い<ruby>森<rt>もり</rt></ruby>",
    "<ruby>山道<rt>やまみち</rt></ruby>", "<ruby>洞窟<rt>どうくつ</rt></ruby>",
    "<ruby>城下町<rt>じょうかまち</rt></ruby>", "<ruby>王<rt>おう</rt></ruby>の<ruby>城<rt>しろ</rt></ruby>"
  ];
  const horizon = 100;

  function drawCloud(x, y) {
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.arc(x + 10, y - 4, 10, 0, Math.PI * 2); ctx.arc(x + 20, y, 8, 0, Math.PI * 2); ctx.fill();
  }

  function drawHouse(x, y, w, h, wallColor, roofColor) {
    ctx.fillStyle = wallColor; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = roofColor;
    ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + w / 2, y - 14); ctx.lineTo(x + w + 4, y); ctx.closePath(); ctx.fill();
  }

  function drawTree(x, groundY, size) {
    ctx.fillStyle = "#5a3a22"; ctx.fillRect(x + size * 0.4, groundY - size * 0.3, size * 0.2, size * 0.3);
    ctx.fillStyle = "#2e6b3e";
    ctx.beginPath(); ctx.moveTo(x, groundY - size * 0.3); ctx.lineTo(x + size * 0.5, groundY - size * 1.1); ctx.lineTo(x + size, groundY - size * 0.3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + size * 0.12, groundY - size * 0.6); ctx.lineTo(x + size * 0.5, groundY - size * 1.4); ctx.lineTo(x + size * 0.88, groundY - size * 0.6); ctx.closePath(); ctx.fill();
  }

  function drawStalactite(x, len) {
    ctx.fillStyle = "#45454f";
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 10, 0); ctx.lineTo(x + 5, len); ctx.closePath(); ctx.fill();
  }

  function drawCrystal(x, y, color) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 10); ctx.lineTo(x - 6, y); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCastleTower(x, y, w, h, color) {
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#d4af37"; ctx.fillRect(x - 2, y - 10, w + 4, 10);
    ctx.fillStyle = "#c0392b";
    ctx.beginPath(); ctx.moveTo(x + w / 2, y - 24); ctx.lineTo(x + w / 2, y - 10); ctx.lineTo(x + w / 2 + 14, y - 16); ctx.closePath(); ctx.fill();
  }

  function drawMountain(baseX, baseY, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(baseX, baseY); ctx.lineTo(baseX + w / 2, baseY - h); ctx.lineTo(baseX + w, baseY); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(baseX + w / 2 - 8, baseY - h + 14); ctx.lineTo(baseX + w / 2, baseY - h); ctx.lineTo(baseX + w / 2 + 8, baseY - h + 14); ctx.closePath(); ctx.fill();
  }

  function drawBackground(level) {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    if (level === 1) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);

      drawCloud(40, 22); drawCloud(150, 16); drawCloud(230, 30);

    } else if (level === 2) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#ffb870"); g.addColorStop(1, "#ffe1b0");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
      ctx.fillStyle = "#b8ae9c"; ctx.fillRect(0, horizon, w, h - horizon);
      ctx.fillStyle = "#8f8574"; ctx.fillRect(0, horizon + 20, w, 6);
      const houseColors = [["#e0a458", "#8c4a2f"], ["#c9d6df", "#5c6b73"], ["#e3b7a0", "#7a4a3a"]];
      let hx = 6;

        drawHouse(hx, horizon - 24, 26, 26, houseColors[i%3][0], houseColors[i%3][1]);
        hx += 72;
      }
    } else if (level === 3) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#8fd6a0"); g.addColorStop(1, "#c7ecc9");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
      ctx.fillStyle = "#3f9a4e"; ctx.fillRect(0, horizon, w, h - horizon);
      [20, 110, 200, 260].forEach(x => drawTree(x, horizon - 4, 26));
    } else if (level === 4) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#1c3a30"); g.addColorStop(1, "#335c46");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
      ctx.fillStyle = "#132a1c"; ctx.fillRect(0, horizon, w, h - horizon);
      [4, 34, 64, 96, 128, 158, 190, 220, 250, 275].forEach((x, i) => drawTree(x, horizon - 2, i % 2 === 0 ? 36 : 28));
    } else if (level === 5) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#8fb8e6"); g.addColorStop(1, "#e6d3b3");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
      drawMountain(-10, horizon, 140, 60, "#7c93a8"); drawMountain(110, horizon, 150, 76, "#647d94"); drawMountain(220, horizon, 120, 54, "#8393a4");
      ctx.fillStyle = "#a99274"; ctx.fillRect(0, horizon, w, h - horizon);
      ctx.fillStyle = "#c8b494"; ctx.fillRect(0, horizon + 16, w, 8);
    } else if (level === 6) {
      ctx.fillStyle = "#14141f"; ctx.fillRect(0, 0, w, horizon);

      drawCrystal(70, horizon - 4, "#66e0ff"); drawCrystal(180, horizon - 2, "#c77dff"); drawCrystal(230, horizon - 6, "#66e0ff");
    } else if (level === 7) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#6a4a8a"); g.addColorStop(1, "#e0a8c0");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
      ctx.fillStyle = "#7a7a8c"; ctx.fillRect(0, horizon - 30, w, 30);
      drawCastleTower(6, horizon - 60, 22, 60, "#8a8a9a"); drawCastleTower(260, horizon - 60, 22, 60, "#8a8a9a");
      ctx.fillStyle = "#b8ae9c"; ctx.fillRect(0, horizon, w, h - horizon);
      const houseColors = [["#e0a458", "#8c4a2f"], ["#c9a0d8", "#5c3a6b"]];
      let hx2 = 30;
      for (let i = 0; i < 3; i++) {
        drawHouse(hx2, horizon - 22, 22, 22, houseColors[i%2][0], houseColors[i%2][1]);
        hx2 += 80;
      }
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, "#190033"); g.addColorStop(0.6, "#400066"); g.addColorStop(1, "#800080");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);

      const stars = [[20,15], [60,35], [95,12], [140,28], [190,10], [225,32], [270,18]];
      ctx.fillStyle = "#ffff99";
      stars.forEach(([sx, sy]) => { ctx.fillRect(sx, sy, 2, 2); ctx.fillRect(sx-1, sy+1, 4, 1); ctx.fillRect(sx+1, sy-1, 1, 4); });

      ctx.fillStyle = "#500a18"; ctx.fillRect(0, horizon, w, h - horizon);
      ctx.fillStyle = "#9e1b32"; ctx.fillRect(0, horizon + 6, w, h - horizon - 6);
      ctx.fillStyle = "#ffd700"; ctx.fillRect(0, horizon, w, 4); ctx.fillRect(0, horizon + 6, w, 2);
      ctx.fillStyle = "#3d3250"; ctx.fillRect(40, horizon - 75, 208, 75);

      ctx.fillStyle = "#2c223c";
      for (let y = horizon - 70; y < horizon; y += 12) {
        for (let x = 45; x < 240; x += 24) { ctx.fillRect(x + ((y % 24 === 0) ? 12 : 0), y, 10, 4); }
      }

      drawCastleTower(10, horizon - 85, 36, 85, "#4d4066"); drawCastleTower(242, horizon - 85, 36, 85, "#4d4066");

      const gateGrad = ctx.createLinearGradient(0, horizon - 50, 0, horizon);
      gateGrad.addColorStop(0, "#d4af37"); gateGrad.addColorStop(1, "#8b6508");
      ctx.fillStyle = gateGrad; ctx.fillRect(114, horizon - 50, 60, 50);

      ctx.beginPath(); ctx.arc(144, horizon - 50, 30, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#1a0f00"; ctx.fillRect(124, horizon - 40, 40, 40);
      ctx.beginPath(); ctx.arc(144, horizon - 40, 20, Math.PI, 0); ctx.fill();

      ctx.fillStyle = "#ffcc00"; ctx.fillRect(52, horizon - 65, 12, 28); ctx.fillRect(224, horizon - 65, 12, 28);
      ctx.fillStyle = "#cc0000"; ctx.fillRect(54, horizon - 63, 8, 24); ctx.fillRect(226, horizon - 63, 8, 24);

      ctx.fillStyle = "#00ffff"; ctx.fillRect(80, horizon - 55, 14, 22); ctx.fillRect(194, horizon - 55, 14, 22);
      ctx.fillStyle = "#ff00ff"; ctx.fillRect(83, horizon - 52, 8, 16); ctx.fillRect(197, horizon - 52, 8, 16);

  function drawGoalMarker() {
    const gx = WALK_MAX_X + 16 * SPRITE_P + 4;
    ctx.fillStyle = "#5a3a22"; ctx.fillRect(gx, horizon - 38, 4, 38);
    ctx.fillStyle = "#ffcc00";
    ctx.beginPath(); ctx.moveTo(gx + 4, horizon - 38); ctx.lineTo(gx + 18, horizon - 32); ctx.lineTo(gx + 4, horizon - 26); ctx.closePath(); ctx.fill();
  }

  const LEVEL_THRESHOLDS = [0, 40, 100, 190, 320, 500, 730, 1000];
  const MAX_POWER = 1500; 

  function levelFromPower(p) {
    let lvl = 1;
    for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
      if (p >= LEVEL_THRESHOLDS[i]) lvl = i + 1;
    }
    return lvl;
  }

  function getPalette(level) {
    const suitByLevel = ["#33cc33", "#2ea86e", "#00cc99", "#00a8c0", "#0066ff", "#5b3df5", "#aa00ff", "#2563eb"];
    const armorByLevel = ["#999999", "#aaaaaa", "#bfbfbf", "#c9b37f", "#d4af37", "#e0c040", "#ffd700", "#ffd700"];
    const capeByLevel = [null, null, null, null, null, "#aa00ff", "#c724a8", "#ff0055"];
    return { suit: suitByLevel[level - 1], armor: armorByLevel[level - 1], cape: capeByLevel[level - 1] };
  }

  const BASE_SPRITE = [
    "................", ".....HHHHHH.....", "....HHHHHHHH....", "....SSSSSSSS....",
    "....SSESSSES....", "....SSSSSSSS....", ".....SMMMM......", "....AAASSAAA....",
    "...AAAASSSAAA...", "...A.LLLLLL.A...", ".....LLLLLL.....", ".....LLLLLL....."
  ];
  const LEG_FRAMES = [
    [".....LL..LL.....", ".....LL..LL.....", "....BBB..BBB...."],
    ["....LL....LL....", "....LL....LL....", "...BBB....BBB..."]
  ];

  function drawSprite(level, ox, oy, p, legFrame, mirrored) {
    const pal = getPalette(level);
    const c = { skin: "#ffcc99", hair: "#663300", eye: "#000000", suit: pal.suit, armor: pal.armor, cape: pal.cape, boots: "#4a2c17", sword: "#ffffff", gold: "#ffcc00" };
    const sprite = BASE_SPRITE.concat(LEG_FRAMES[legFrame % 2], ["................"]);

    ctx.save();
    ctx.translate(ox, oy);
    if (mirrored) { ctx.translate(16 * p, 0); ctx.scale(-1, 1); }

    if (level >= 8) {
      ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = c.gold;
      ctx.beginPath(); ctx.arc(8 * p, 8 * p, 9 * p, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    if (c.cape) {
      ctx.fillStyle = c.cape;
      ctx.beginPath(); ctx.moveTo(3 * p, 6 * p); ctx.lineTo(13 * p, 6 * p); ctx.lineTo(15 * p, 14.5 * p); ctx.lineTo(1 * p, 14.5 * p); ctx.closePath(); ctx.fill();
    }

    for (let r = 0; r < 16; r++) {
      for (let col = 0; col < 16; col++) {
        const char = sprite[r][col];
        if (char === ".") continue;
        if (char === "H") ctx.fillStyle = c.hair;
        if (char === "S") ctx.fillStyle = c.skin;
        if (char === "E") ctx.fillStyle = c.eye;
        if (char === "M") ctx.fillStyle = "#ff6666";
        if (char === "A") ctx.fillStyle = c.armor;
        if (char === "L") ctx.fillStyle = c.suit;
        if (char === "B") ctx.fillStyle = c.boots;
        ctx.fillRect(col * p, r * p, p, p);
      }
    }

    if (level >= 2) {
      ctx.fillStyle = c.sword; ctx.fillRect(12 * p, 4 * p, 2 * p, 8 * p);
      ctx.fillStyle = c.gold; ctx.fillRect(11 * p, 8 * p, 4 * p, 2 * p);
    }
    if (level >= 8) {
      ctx.fillStyle = c.gold;
      ctx.fillRect(5 * p, 0, p, p * 0.6); ctx.fillRect(7 * p, 0, p, p * 0.6); ctx.fillRect(9 * p, 0, p, p * 0.6);
    }
    ctx.restore();
  }

  const SPRITE_P = 5;
  const WALK_MIN_X = 20;
  const WALK_MAX_X = canvas.width - 24 - 16 * SPRITE_P;
  const WALK_SPEED = 55;
  let walkX = WALK_MIN_X;
  let targetX = WALK_MIN_X;
  let legFrame = 0;
  let legToggleAccum = 0;
  let lastFrameTs = 0;
  let bounceStart = null;
  let bounceDuration = 0;
  let loopStarted = false;

  function triggerBounce(duration) {
    bounceStart = performance.now();
    bounceDuration = duration;
  }

  function progressRatio() {
    const lvl = currentLevel;
    if (lvl >= 8) {
      const baseVal = LEVEL_THRESHOLDS[7]; 
      return Math.max(0, Math.min(1, (state.power - baseVal) / (MAX_POWER - baseVal)));
    }
    const lower = LEVEL_THRESHOLDS[lvl - 1];
    const upper = LEVEL_THRESHOLDS[lvl];
    return Math.max(0, Math.min(1, (state.power - lower) / (upper - lower)));
  }

  function updateTargetX() {
    targetX = WALK_MIN_X + progressRatio() * (WALK_MAX_X - WALK_MIN_X);
  }

  function updatePowerDisplay() {
    const todayPowerEl = document.getElementById('todayPower');
    const canvasEl = document.getElementById('characterCanvas');
    
    todayPowerEl.textContent = state.todayPower;
    document.getElementById('yesterdayPower').textContent = state.yesterdayPower;

    if (state.surpassedToday) {
      todayPowerEl.classList.add('power-surpassed');
      canvasEl.classList.add('hero-awakened');
    } else {
      todayPowerEl.classList.remove('power-surpassed');
      canvasEl.classList.remove('hero-awakened');
      auraEffect.clear(); 
    }
  }

  function updateXpUI() {
    const fill = document.getElementById('xpBarFill');
    const label = document.getElementById('xpLabel');
    if (currentLevel >= 8) {
      const remaining = Math.max(0, MAX_POWER - state.power);
      const pct = Math.min(100, Math.floor(((state.power - 1000) / (MAX_POWER - 1000)) * 100));
      fill.style.width = pct + '%';
      if (remaining === 0) {
        label.innerHTML = 'カンスト！ でんせつのヒーロー達成！';
      } else {
        label.innerHTML = `ゴールまで あと ${remaining} pt`;
      }
    } else {
      const upper = LEVEL_THRESHOLDS[currentLevel];
      const lower = LEVEL_THRESHOLDS[currentLevel - 1];
      const pct = Math.min(100, Math.floor(((state.power - lower) / (upper - lower)) * 100));
      fill.style.width = pct + '%';
      label.innerHTML = `つぎのレベルまで あと ${Math.max(0, upper - state.power)} pt`;
    }
  }

  function renderLoop(ts) {
    if (!lastFrameTs) lastFrameTs = ts;
    let dt = ts - lastFrameTs;
    if (dt > 100) dt = 16; 
    lastFrameTs = ts;

    if (Math.abs(targetX - walkX) > 0.5) {
      const step = WALK_SPEED * (dt / 1000);
      walkX = (targetX > walkX) ? Math.min(targetX, walkX + step) : Math.max(targetX, walkX - step);
      legToggleAccum += dt;
      if (legToggleAccum > 140) { 
        legFrame = legFrame === 0 ? 1 : 0; 
        legToggleAccum = 0; 
      }
    } else {
      walkX = targetX;
      legFrame = 0;
    }

    let bounceOffset = 0;
    if (bounceStart !== null) {
      const elapsed = ts - bounceStart;
      if (elapsed < bounceDuration) {
        bounceOffset = -Math.abs(Math.sin((elapsed / bounceDuration) * Math.PI)) * 14;
      } else {
        bounceStart = null;
      }
    }

    drawBackground(currentLevel);
    drawGoalMarker();
    
    const spriteY = horizon - 15 * SPRITE_P + bounceOffset;
    drawSprite(currentLevel, walkX, spriteY, SPRITE_P, legFrame, false);

    if (state.surpassedToday) {
      auraEffect.updateAndDraw();
    }

    fireworks.updateAndDraw();
    requestAnimationFrame(renderLoop);
  }

  function startAnimationLoop() {
    if (loopStarted) return;
    loopStarted = true;
    requestAnimationFrame(renderLoop);
  }

  function loadHero() {
    const rawName = document.getElementById('heroName').value;
    const name = escapeHtml(rawName.trim() || 'ヒーロー');
    const key = heroStorageKey(name);
    
    document.getElementById('powerUpBtn').disabled = true;

    try {
      const value = localStorage.getItem(key);
      if (value) {
        const parsed = JSON.parse(value);
        state = {
          power: parsed.power || 0,
          todayPower: parsed.todayPower || 0,
          yesterdayPower: parsed.yesterdayPower || 0,
          surpassedToday: parsed.surpassedToday || false,
          history: parsed.history || [],
          parentLock: parsed.parentLock !== undefined ? parsed.parentLock : false,
          categoryCounts: parsed.categoryCounts || {},
          lastPlayDate: parsed.lastPlayDate || "",
          lastSkill: parsed.lastSkill || "",
          lastMsg: parsed.lastMsg || ""
        };
      } else {
        state = { power: 0, todayPower: 0, yesterdayPower: 0, surpassedToday: false, history: [], parentLock: false, categoryCounts: {}, lastPlayDate: "", lastSkill: "", lastMsg: "" };
      }
    } catch (e) {
      state = { power: 0, todayPower: 0, yesterdayPower: 0, surpassedToday: false, history: [], parentLock: false, categoryCounts: {}, lastPlayDate: "", lastSkill: "", lastMsg: "" };
    }

    const today = getTodayStr();
    if (state.lastPlayDate !== today) {
      if (state.lastPlayDate) {
        state.yesterdayPower = state.todayPower;
      }
      state.todayPower = 0;
      state.surpassedToday = false; 
      state.categoryCounts = {};
      state.lastPlayDate = today;
    }

    currentHeroKey = key;
    currentLevel = levelFromPower(state.power);
    updatePowerDisplay();
    updateTitle(currentLevel);
    updateXpUI();
    walkX = WALK_MIN_X;
    updateTargetX();
    startAnimationLoop();
    renderHistory();
    updateParentLockUI();
    
    document.getElementById('loadingNote').style.display = 'none';

    setTimeout(() => { updateTitle(currentLevel); }, 4000);
  }

  function saveHero() {
    if (!currentHeroKey) return;
    localStorage.setItem(currentHeroKey, JSON.stringify(state));
  }

  function resetHero() {
    if (!currentHeroKey) return;
    if (!confirm('このヒーローの記録をすべて消しますか？')) return;
    localStorage.removeItem(currentHeroKey);

    const firstRadio = document.querySelector('input[name="actionCategory"][value="宿題・勉強"]');
    if (firstRadio) firstRadio.checked = true;

    document.getElementById('actionTime').value = "5";
    document.getElementById('actionDetail').value = "";

    const msgBox = document.getElementById('msgBox');
    msgBox.style.display = 'none';
    document.getElementById('skillName').innerHTML = "";
    document.getElementById('msgContent').innerHTML = "";
    
    state.surpassedToday = false;
    updatePowerDisplay();

    loadHero();
  }

  function getRandomMessage(name, category, detail, timeMinutes) {
    const detailStr = detail ? `（${detail}）` : "";
    const msgPool = [
      `【<ruby>評価<rt>ひょうか</rt></ruby>】${timeMinutes}<ruby>分間<rt>ふんかん</rt></ruby>、<ruby>集中<rt>しゅうちゅう</rt></ruby>して「${category}${detailStr}」に<ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだ！${name}の<ruby>頑張<rt>がんば</rt></ruby>りでパワーが<ruby>満ち溢<rt>みちあふ</rt></ruby>れる！`,
      `【<ruby>評価<rt>ひょうか</rt></ruby>】すさまじい<ruby>集中力<rt>しゅうちゅうりょく</rt></ruby>だ！${timeMinutes}<ruby>分間<rt>ふんかん</rt></ruby>の「${category}${detailStr}」で${name}の<ruby>攻撃力<rt>こうげきりょく</rt></ruby>が<ruby>大幅<rt>おおはば</rt></ruby>アップ！その<ruby>調子<rt>ちょうし</rt></ruby>で<ruby>突<rt>つ</rt></ruby>き<ruby>進<rt>すす</rt></ruby>め！`,
      `【<ruby>評価<rt>ひょうか</rt></ruby>】<ruby>素晴<rt>すば</rt></ruby>らしい<ruby>継続力<rt>けいぞくりょく</rt></ruby>！${timeMinutes}<ruby>分間<rt>ふんかん</rt></ruby>の<ruby>努力<rt>どりょく</rt></ruby>「${category}${detailStr}」がヒーローの<ruby>大<rt>おお</rt></ruby>きな<ruby>糧<rt>かて</rt></ruby>となった！<ruby>新<rt>あたら</rt></ruby>たな<ruby>高<rt>たか</rt></ruby>みへ！`,
      `【<ruby>評価<rt>ひょうか</rt></ruby>】<ruby>伝説<rt>でんせつ</rt></ruby>の<ruby>勇者<rt>ゆうしゃ</rt></ruby>への<ruby>第一歩<rt>だいいっぽ</rt></ruby>！${timeMinutes}<ruby>分間<rt>ふんかん</rt></ruby>じっくり「${category}${detailStr}」をやり<ruby>遂<rt>と</rt></ruby>げたぞ！${name}の<ruby>成長<rt>せいちょう</rt></ruby>は<ruby>誰<rt>だれ</rt></ruby>にも<ruby>止<rt>と</rt></ruby>められない！`
    ];

    let availableMsgs = msgPool.filter(m => m !== state.lastMsg);
    if (availableMsgs.length === 0) availableMsgs = msgPool;
    const selectedMsg = availableMsgs[Math.floor(Math.random() * availableMsgs.length)];
    state.lastMsg = selectedMsg;
    return selectedMsg;
  }

  function executePowerUp() {
    const today = getTodayStr();
    if (state.lastPlayDate !== today) {
      if (state.lastPlayDate) {
        state.yesterdayPower = state.todayPower;
      }
      state.todayPower = 0;
      state.surpassedToday = false;
      state.categoryCounts = {};
      state.lastPlayDate = today;
      updatePowerDisplay();
    }

    const selectedRadio = document.querySelector('input[name="actionCategory"]:checked');
    const category = selectedRadio ? selectedRadio.value : "宿題・勉強";

    const catRubyNames = {
      "宿題・勉強": "「【<ruby>学習<rt>がくしゅう</rt></ruby>】<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>」",
      "お手伝い": "「【<ruby>貢献<rt>こうけん</rt></ruby>】お<ruby>手伝<rt>てつだ</rt></ruby>い・<ruby>掃除<rt>そうじ</rt></ruby>」",
      "運動・健康": "「【<ruby>体力<rt>たいりょく</rt></ruby>】<ruby>運動<rt>うんどう</rt></ruby>・<ruby>早<rt>はや</rt></ruby><ruby>起<rt>お</rt></ruby>き」",
      "読書": "「【<ruby>知識<rt>ちしき</rt></ruby>】<ruby>読書<rt>どくしょ</rt></ruby>・<ruby>図鑑<rt>ずかん</rt></ruby>」"
    };

    const msgBox = document.getElementById('msgBox');
    const msgTitle = document.getElementById('msgTitle');

    if (state.parentLock) {
      const currentCount = state.categoryCounts[category] || 0;
      if (currentCount >= 2) {
        msgBox.style.borderColor = "#ff4d4d";
        msgTitle.style.color = "#ff4d4d";
        msgTitle.innerHTML = "⚠️ <ruby>回数<rt>かいすう</rt></ruby><ruby>制限<rt>せいげん</rt></ruby>のおしらせ";
        document.getElementById('skillName').innerHTML = "";
        document.getElementById('msgContent').innerHTML = `${catRubyNames[category] || category}は<ruby>本日<rt>ほんじつ</rt></ruby>すでに2<ruby>回<rt>かい</rt></ruby>おこないました。<ruby>他<rt>ほか</rt></ruby>のカテゴリーを<ruby>選<rt>えら</rt></ruby>ぶか、<ruby>明日<rt>あした</rt></ruby>また<ruby>挑戦<rt>ちょうせん</rt></ruby>してね！`;
        msgBox.style.display = 'block';
        msgBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
    }

    msgBox.style.borderColor = "#ffffff";
    msgTitle.style.color = "#ffcc00";

    const btn = document.getElementById('powerUpBtn');
    btn.disabled = true;

    const timeMinutes = parseInt(document.getElementById('actionTime').value) || 5;
    const rawDetail = document.getElementById('actionDetail').value.trim();
    const rawName = document.getElementById('heroName').value;
    
    const detail = escapeHtml(rawDetail);
    const name = escapeHtml(rawName || "ヒーロー");

    const skillsMap = {
      "宿題・勉強": [
        "<ruby>集中<rt>しゅうちゅう</rt></ruby>ドリル<ruby>斬<rt>ぎ</rt></ruby>り",
        "ブレイン・スマッシュ",
        "<ruby>閃光<rt>せんこう</rt></ruby>スタディ・バースト",
        "<ruby>知恵<rt>ちえ</rt></ruby>のメテオストライク"
      ],
      "お手伝い": [
        "ピカピカクリーンブレイク",
        "おたすけハリケーン",
        "サンキュー・エクスプロージョン",
        "<ruby>奉仕<rt>ほうし</rt></ruby>のホーリーレイ"
      ],
      "運動・健康": [
        "<ruby>爆速<rt>ばくそく</rt></ruby>ダッシュストライク",
        "マッスル・ボルケーノ",
        "<ruby>健康<rt>けんこう</rt></ruby>パワースマッシュ",
        "エナジー・トルネード"
      ],
      "読書": [
        "ナレッジウェーブ",
        "イマジネーション・ダイブ",
        "ブック・オブ・ジャッジメント",
        "<ruby>知能<rt>ちのう</rt></ruby>フレア"
      ]
    };

    let skillPool = skillsMap[category] || ["ミライヒーロー<ruby>斬<rt>ぎ</rt></ruby>り"];
    let availableSkills = skillPool.filter(s => s !== state.lastSkill);
    if (availableSkills.length === 0) availableSkills = skillPool;
    const skill = availableSkills[Math.floor(Math.random() * availableSkills.length)];
    state.lastSkill = skill;

    state.categoryCounts[category] = (state.categoryCounts[category] || 0) + 1;

    let fireworkTriggered = false;
    const beforePower = state.todayPower;
    
    const bonus = Math.floor(timeMinutes * 0.45) + 3;
    state.power += bonus;
    state.todayPower += bonus;

    if (state.yesterdayPower > 0 && !state.surpassedToday) {
      if (beforePower <= state.yesterdayPower && state.todayPower > state.yesterdayPower) {
        state.surpassedToday = true;
        fireworkTriggered = true;
      }
    }

    let title = `🔥 パワーアップ！ (+${bonus} PT)`;
    let msg = getRandomMessage(name, category, detail, timeMinutes);

    if (fireworkTriggered) {
      fireworks.start();
      title = `🎇 <ruby>昨日超越<rt>きのうちょうえつ</rt></ruby>！ (+${bonus} PT)`;
      msg = `【<ruby>大突破<rt>だいとっぱ</rt></ruby>】すさまじい<ruby>努力<rt>どりょく</rt></ruby>だ！${name}の<ruby>頑張<rt>がんば</rt></ruby>りが<ruby>昨日<rt>きのう</rt></ruby>の<ruby>自分<rt>じぶん</rt></ruby>（${state.yesterdayPower}PT）を<ruby>見事<rt>みごと</rt></ruby>に<ruby>超<rt>こ</rt></ruby>え、<ruby>長岡<rt>ながおか</rt></ruby>の<ruby>夜空<rt>よぞら</rt></ruby>に<ruby>大輪<rt>たいりん</rt></ruby>の<ruby>祝福花火<rt>しゅくふくはなび</rt></ruby>が<ruby>打<rt>う</rt></ruby>ち<ruby>上<rt>あ</rt></ruby>がったぞ！！`;
    } else {
      play8BitSound(true);
    }

    const catLabels = {
      "宿題・勉強": "<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>",
      "お手伝い": "お<ruby>手伝<rt>てつだ</rt></ruby>い",
      "運動・健康": "<ruby>運動<rt>うんどう</rt></ruby>・<ruby>健康<rt>けんこう</rt></ruby>",
      "読書": "<ruby>読書<rt>どくしょ</rt></ruby>"
    };

    state.history.unshift({
      date: getDateTimeStr(),
      label: `${catLabels[category] || category}${detail ? '（' + detail + '）' : ''} / ${timeMinutes}<ruby>分<rt>ふん</rt></ruby>`,
      bonus: bonus
    });
    state.history = state.history.slice(0, 30);

    updatePowerDisplay();
    msgTitle.innerHTML = title;
    document.getElementById('skillName').innerHTML = `⚔️ ひっさつわざ：「${skill}」`;
    document.getElementById('msgContent').innerHTML = msg;
    msgBox.style.display = 'block';
    
    msgBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    renderHistory();

    const stage = document.getElementById('stage');
    const newLevel = levelFromPower(state.power);
    const leveledUp = newLevel > currentLevel;

    stage.classList.add(leveledUp ? 'leveling-up' : 'powering-up');
    triggerBounce(leveledUp ? 1600 : 900);
    if (leveledUp) {
      const banner = document.getElementById('levelupBanner');
      banner.innerHTML = `★ ${SCENE_NAMES[newLevel - 1]}に<ruby>到着<rt>とうちゃく</rt></ruby>！レベルアップ！ ★`;
      banner.style.display = 'block';
      banner.style.animation = 'none';
      void banner.offsetWidth;
      banner.style.animation = '';
      walkX = WALK_MIN_X;
    }

    currentLevel = newLevel;
    updateTitle(currentLevel);
    updateXpUI();
    updateTargetX();

    setTimeout(() => {
      stage.classList.remove('powering-up');
      stage.classList.remove('leveling-up');
    }, leveledUp ? 1600 : 1200);

    saveHero();
    updateParentLockUI();
  }

  document.getElementById('heroName').addEventListener('change', loadHero);

  loadHero();
</script>

</body>
</html>
