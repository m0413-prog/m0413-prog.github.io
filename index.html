<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>越え⚔️ロード</title>
  
  <!-- フォント読み込みの非ブロッキング化 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  
  <!-- 剣の絵文字Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>⚔️</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'DotGothic16', monospace;
      image-rendering: pixelated;
    }

    body {
      background-color: #050510;
      background-image:
        radial-gradient(#1e1e38 15%, transparent 16%),
        radial-gradient(#1e1e38 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #ffffff;
      margin: 0;
      padding: 16px 8px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    ruby {
      ruby-align: center;
    }
    rt {
      font-size: 0.65em;
      color: #ffcc00;
      font-weight: normal;
      line-height: 1.2;
    }

    .rpg-window {
      max-width: 460px;
      width: 100%;
      background: #000044;
      border: 4px solid #ffffff;
      outline: 4px solid #000000;
      box-shadow: inset 0 0 0 4px #0000aa, 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 4px;
      padding: 16px;
      position: relative;
    }

    .title-banner {
      text-align: center;
      background: #e60000;
      border: 2px solid #fff;
      color: #ffff00;
      font-size: 22px;
      padding: 6px;
      margin-bottom: 4px;
      text-shadow: 2px 2px #000;
      letter-spacing: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aaaaff;
      margin-bottom: 12px;
    }

    .parent-bar {
      background: #000022;
      border: 1px dashed #8888ff;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .parent-btn {
      background: #444477;
      border: 1px solid #aaaaff;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 3px;
    }

    /* キャラクター画面を上部固定（Sticky）に設定 */
    .stage {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: #000022;
      border: 3px solid #5555ff;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.9);
      transition: filter 0.5s ease;
    }

    .level-badge {
      display: inline-block;
      background: #ffcc00;
      color: #000;
      font-size: 14px;
      padding: 2px 8px;
      border: 2px solid #fff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .level-badge rt {
      color: #000000;
      font-weight: bold;
    }

    #characterCanvas {
      background: transparent;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 8px rgba(0,255,255,0.4));
      transition: filter 0.5s ease;
    }

    .powering-up #characterCanvas {
      animation: auraGlow 0.3s infinite alternate;
    }

    .leveling-up #characterCanvas {
      animation: auraGlow 0.25s infinite alternate;
    }

    @keyframes auraGlow {
      0% { filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 12px #ffff00); }
      100% { filter: drop-shadow(0 0 16px #ff00ff) drop-shadow(0 0 24px #ffffff); }
    }

    /* 昨日超えを達成した日の持続的なヒーロー覚醒オーラ */
    .hero-awakened {
      animation: awakenedGlow 1.5s infinite alternate !important;
    }

    @keyframes awakenedGlow {
      0% { filter: drop-shadow(0 0 6px #ffcc00) drop-shadow(0 0 12px #ff4400); }
      100% { filter: drop-shadow(0 0 16px #ffff00) drop-shadow(0 0 30px #ff00ff); }
    }

    .levelup-banner {
      display: none;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffcc00;
      color: #000;
      font-size: 13px;
      padding: 4px 10px;
      border: 2px solid #fff;
      white-space: nowrap;
      animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -14px); }
    }

    .status-container {
      display: flex;
      justify-content: space-around;
      background: #000;
      border: 2px solid #fff;
      padding: 6px;
      margin-top: 8px;
    }

    .xp-bar-wrap {
      background: #000;
      border: 2px solid #fff;
      height: 12px;
      margin-top: 8px;
      overflow: hidden;
    }

    .xp-bar-fill {
      background: linear-gradient(90deg, #ffcc00, #ff8800);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease-out;
    }

    .xp-label {
      text-align: center;
      font-size: 11px;
      color: #aaaaff;
      margin-top: 4px;
    }

    .status-item {
      text-align: center;
    }

    .status-title {
      font-size: 11px;
      color: #8888ff;
    }

    .status-num {
      font-size: 20px;
      color: #00ffcc;
      text-shadow: 2px 2px #000;
      transition: transform 0.2s ease;
    }

    /* 昨日超越時の特別発光エフェクト（数字） */
    .power-surpassed {
      color: #ffff00 !important;
      text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff8800, 2px 2px #000 !important;
      animation: pulseGlow 1s infinite alternate;
      display: inline-block;
    }
    @keyframes pulseGlow {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); text-shadow: 0 0 15px #ffff00, 0 0 30px #ff00ff, 2px 2px #000; }
    }

    .input-group {
      background: #000033;
      border: 2px solid #8888ff;
      padding: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #ffff00;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    label:first-child {
      margin-top: 0;
    }

    input[type="text"], select {
      width: 100%;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    /* 左右ズレ解消＆文字押し広げ防止 */
    .radio-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 4px;
      margin-bottom: 12px;
      background: #000;
      border: 2px solid #fff;
      padding: 8px;
    }

    .radio-item {
      display: flex;
      align-items: flex-start;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.3;
      padding: 2px;
      border-radius: 3px;
      min-width: 0;
      min-height: 40px;
    }

    .radio-item span {
      min-width: 0;
      display: block;
    }

    .radio-item:hover {
      background: #111144;
    }

    .radio-item input[type="radio"] {
      margin-top: 3px;
      margin-right: 4px;
      accent-color: #ffcc00;
      cursor: pointer;
      flex-shrink: 0;
    }

    .example-box {
      font-size: 12px;
      color: #aaaaff;
      margin-bottom: 6px;
      padding-left: 4px;
      line-height: 1.8;
    }

    .flex-row {
      display: flex;
      gap: 8px;
    }

    .rpg-btn {
      width: 100%;
      background: #cc0000;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px;
      font-size: 18px;
      cursor: pointer;
      text-shadow: 2px 2px #000;
      box-shadow: 3px 3px 0px #000;
      margin-top: 8px;
    }

    .rpg-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .rpg-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .msg-box {
      background: #000;
      border: 3px solid #fff;
      padding: 12px;
      margin-top: 16px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.8;
      transition: border-color 0.2s ease;
    }

    .msg-title {
      color: #ffcc00;
      font-size: 16px;
      margin-bottom: 6px;
      border-bottom: 1px dashed #fff;
      padding-bottom: 4px;
      transition: color 0.2s ease;
    }

    .skill-name {
      color: #00ffcc;
      font-size: 15px;
      margin-bottom: 6px;
    }

    details.rpg-accordion {
      background: #000022;
      border: 2px solid #5555ff;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    
    details.rpg-accordion summary {
      color: #aaaaff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      list-style: none; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details.rpg-accordion summary::-webkit-details-marker {
      display: none; 
    }

    .summary-title::before {
      content: '▶ ';
      font-size: 12px;
      display: inline-block;
    }
    details.rpg-accordion[open] .summary-title::before {
      content: '▼ ';
    }
    details.rpg-accordion[open] summary {
      margin-bottom: 12px;
      border-bottom: 1px dashed #333366;
      padding-bottom: 8px;
    }

    .history-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
      border-bottom: 1px dotted #333366;
      color: #ccccdd;
    }

    .history-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-date {
      color: #8888ff;
      font-size: 10px;
    }

    .history-pt {
      color: #00ffcc;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .history-empty {
      color: #666699;
      font-size: 12px;
      text-align: center;
      padding: 8px 0;
    }

    .sub-btn {
      background: #333366;
      border: 2px solid #8888ff;
      color: #ccccff;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="rpg-window">
  <div class="title-banner">越え⚔️ロード</div>
  <div class="subtitle">〜 <ruby>昨日<rt>きのう</rt></ruby>の<ruby>自分<rt>じぶん</rt></ruby>を<ruby>越<rt>こ</rt></ruby>える、<ruby>長岡<rt>ながおか</rt></ruby>ヒーロー<ruby>育成<rt>いくせい</rt></ruby>RPG 〜</div>
  
  <div class="stage" id="stage">
    <div class="levelup-banner" id="levelupBanner">★ レベルアップ！ ★</div>
    <div class="level-badge" id="heroTitle"></div>
    <canvas id="characterCanvas" width="288" height="144" style="max-width:100%; height:auto; border:2px solid #333366;"></canvas>

    <div class="xp-bar-wrap">
      <div class="xp-bar-fill" id="xpBarFill"></div>
    </div>
    <div class="xp-label" id="xpLabel">-</div>

    <div class="status-container">
      <div class="status-item">
        <div class="status-title"><ruby>今日<rt>きょう</rt></ruby>のパワー</div>
        <div class="status-num" id="todayPower">-</div>
      </div>
      <div class="status-item">
        <div class="status-title"><ruby>昨日<rt>きのう</rt></ruby>のパワー</div>
        <div class="status-num" id="yesterdayPower">-</div>
      </div>
    </div>
  </div>

  <div class="input-group">
    <label style="margin-top: 0;">▶ ヒーローの<ruby>名<rt>な</rt></ruby>まえ</label>
    <input type="text" id="heroName" value="ミライ" placeholder="※ほんみょうはいれないでね">

    <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだカテゴリー</label>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="宿題・勉強" data-label="宿題・勉強" checked>
        <span>【<ruby>学習<rt>がくしゅう</rt></ruby>】<ruby>宿題<rt>しゅくだい</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="お手伝い" data-label="お手伝い">
        <span>【<ruby>貢献<rt>こうけん</rt></ruby>】お<ruby>手伝<rt>てつだ</rt></ruby>い・<ruby>掃除<rt>そうじ</rt></ruby></span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="運動・健康" data-label="運動・健康">
        <span>【<ruby>体力<rt>たいりょく</rt></ruby>】<ruby>運動<rt>うんどう</rt></ruby>・<ruby>早<rt>はや</rt></ruby><ruby>起<rt>お</rt></ruby>き</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="actionCategory" value="読書" data-label="読書">
        <span>【<ruby>知識<rt>ちしき</rt></ruby>】<ruby>読書<rt>どくしょ</rt></ruby>・<ruby>図鑑<rt>ずかん</rt></ruby></span>
      </label>
    </div>

    <div class="flex-row">
      <div style="flex: 1;">
        <label>▶ <ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>んだ<ruby>時間<rt>じかん</rt></ruby></label>
        <select id="actionTime">
          <option value="5" selected>5分間</option>
          <option value="10">10分間</option>
          <option value="15">15分間</option>
          <option value="30">30分間</option>
          <option value="45">45分間</option>
          <option value="60">60分以上</option>
        </select>
      </div>
    </div>

    <label>▶ <ruby>詳<rt>くわ</rt></ruby>しい<ruby>内容<rt>ないよう</rt></ruby>（メモ）</label>
    <div class="example-box">
      <ruby>例<rt>れい</rt></ruby>：<ruby>漢字<rt>かんじ</rt></ruby>ドリル／<ruby>皿洗<rt>さらあら</rt></ruby>い／<ruby>走<rt>はし</rt></ruby>り<ruby>込<rt>こ</rt></ruby>み
    </div>
    <input type="text" id="actionDetail" placeholder="なにをしたか入力してね">

    <button class="rpg-btn" id="powerUpBtn" onclick="executePowerUp()">⚔️ パワーアップ！</button>
  </div>

  <div class="msg-box" id="msgBox">
    <div class="msg-title" id="msgTitle">★ <ruby>判定<rt>はんてい</rt></ruby><ruby>結果<rt>けっか</rt></ruby></div>
    <div class="skill-name" id="skillName"></div>
    <div id="msgContent"></div>
  </div>

  <details class="rpg-accordion">
    <summary>
      <span class="summary-title">📜 ぼうけんの<ruby>記録<rt>きろく</rt></ruby>をみる</span>
      <span id="historyCount"></span>
    </summary>
    <div class="history-list" id="historyList">
      <div class="history-empty">まだ<ruby>記録<rt>きろく</rt></ruby>がありません</div>
    </div>
  </details>

  <details class="rpg-accordion" style="border-color: #8888ff;">
    <summary>
      <span class="summary-title">⚙️ ぼうけんのせってい</span>
    </summary>
    <div style="margin-top: 8px;">
      <div class="parent-bar">
        <span id="lockStatus">🔓 プレイ<ruby>制限<rt>せいげん</rt></ruby>: <ruby>無制限<rt>むせいげん</rt></ruby></span>
        <button class="parent-btn" onclick="toggleParentControl()">🔒 <ruby>保護者<rt>ほごしゃ</rt></ruby><ruby>設定<rt>せってい</rt></ruby></button>
      </div>
      <button class="sub-btn" style="width: 100%; margin-top: 0;" onclick="resetHero()">🔄 このヒーローのデータをリセット</button>
      <button class="sub-btn" style="width: 100%; background: #aa00aa; border-color: #ff00ff; color: #ffffff; font-weight: bold; margin-bottom: 4px; margin-top: 16px;" onclick="testFirework()">🎆 花火演出だけをテスト再生する</button>
    </div>
  </details>

</div>

<script>
  const canvas = document.getElementById('characterCanvas');
  const ctx = canvas.getContext('2d');

  const PARENT_PIN = "361";

  let state = {
    power: 0,
    todayPower: 0,
    yesterdayPower: 0,
    surpassedToday: false, 
    history: [],
    parentLock: false,
    categoryCounts: {},
    lastPlayDate: "",
    lastSkill: "",
    lastMsg: ""
  };

  let currentHeroKey = null;
  let currentLevel = 1;

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getDateTimeStr() {
    const d = new Date();
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // ── 長岡花火風エフェクトクラス ──
  class NagaokaFireworksEffect {
    constructor(canvas, ctx) {
      this.canvas = canvas;
      this.ctx = ctx;
      this.particles = [];
      this.active = false;
    }

    start() {
      this.particles = [];
      this.active = true;

      const centerX = this.canvas.width / 2;
      const centerY = this.canvas.height / 3;
      const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#ffffff', '#3498db', '#ff00ff'];

      for (let i = 0; i < 200; i++) {
        const angle = (Math.PI * 2 / 200) * i;
        const speed = Math.random() * 5 + 1; 
        this.particles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() > 0.5 ? 4 : 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }
      playFireworkSound();
    }

    updateAndDraw() {
      if (!this.active) return;
      this.ctx.save();
      let allDead = true;
      this.particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03; 
        p.alpha -= 0.005; 
        if (p.alpha > 0) {
          allDead = false;
          this.ctx.fillStyle = p.color;
          this.ctx.globalAlpha = p.alpha;
          this.ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
      });
      if (allDead) this.active = false;
      this.ctx.restore();
    }
  }

  // ── 昨日超えを達成した日の継続オーラエフェクト ──
  class AwakenedAuraEffect {
    constructor(canvas, ctx) {
      this.canvas = canvas;
      this.ctx = ctx;
      this.particles = [];
    }

    updateAndDraw() {
      if (this.particles.length < 40) {
        if (Math.random() < 0.3) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: this.canvas.height + 5,
            speed: Math.random() * 0.8 + 0.2,
            size: Math.random() * 3 + 1,
            alpha: 0,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      this.ctx.save();
      const colors = ['#ffcc00', '#ffff99', '#ff9900'];
      for (let i = this.particles.length - 1; i >= 0; i--) {
        let p = this.particles[i];
        p.y -= p.speed;
        p.x += Math.sin(p.y * 0.05 + p.phase) * 0.3; 
        
        if (p.y > this.canvas.height - 20) {
          p.alpha += 0.05;
        } else if (p.y < 30) {
          p.alpha -= 0.03;
        } else {
          p.alpha = 0.8;
        }
        
        this.ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
        this.ctx.fillStyle = colors[i % colors.length];
        this.ctx.fillRect(p.x, p.y, p.size, p.size);

        if (p.alpha <= 0 && p.y < 30) {
          this.particles.splice(i, 1);
        }
      }
      this.ctx.restore();
    }
    
    clear() {
      this.particles = [];
    }
  }

  const fireworks = new NagaokaFireworksEffect(canvas, ctx);
  const auraEffect = new AwakenedAuraEffect(canvas, ctx);

  function playFireworkSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(400, now);
      osc1.frequency.exponentialRampToValueAtTime(800, now + 0.6);
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(0.1, now + 0.1);
      gain1.gain.linearRampToValueAtTime(0.01, now + 0.6);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.6);
